<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Al Shaalan Real Estate – Five Keys</title>
<style>
@font-face{font-family:AlexAr;src:url(assets/fonts/alexandria-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:AlexAr;src:url(assets/fonts/alexandria-arabic-700-normal.woff2);font-weight:700}

:root{--n:#152F4A;--n2:#22476B;--sd:#B7AD98;--sdd:#9C9179;--cu:#B87955;--iv:#F3F1EC;--lg:#E9ECEE;--ch:#26313B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--iv)}
body{font-family:PlexAr,PlexLat,sans-serif;color:var(--ch)}
.h{font-family:AlexAr,AlexLat,sans-serif}
.abs{position:absolute}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 900px 1100px at 50% 46%,#fff 0%,#F9F8F5 50%,var(--iv) 100%)}
.layer{position:absolute;inset:0;transform-origin:540px 960px}
.ctr{left:0;width:1080px;text-align:center}
.wr span{display:inline-block}
.card{background:#fff;border-radius:24px;box-shadow:0 20px 44px rgba(21,47,74,.10),0 3px 8px rgba(21,47,74,.06)}
.bar{position:absolute;height:12px;border-radius:6px;background:var(--lg)}
.sd{color:var(--sdd)}
.cu{color:var(--cu)}
.keysvg{position:absolute;left:0;top:0;width:310px;height:120px;transform-origin:155px 60px;filter:drop-shadow(0 14px 18px rgba(21,47,74,.25))}
.slot{position:absolute;width:132px;height:132px;border-radius:50%;border:3px solid #D9DDE1;background:rgba(255,255,255,.92)}
.slot .n{position:absolute;top:-46px;left:0;width:132px;text-align:center;font-family:AlexLat;font-weight:700;font-size:28px;color:#9AA3AC}
.slot .ok{position:absolute;right:-8px;top:-8px;width:46px;height:46px;border-radius:50%;background:var(--n);border:3px solid var(--sd);display:flex;align-items:center;justify-content:center}
.lab{font-size:34px;font-weight:600;color:var(--n);text-align:center}
.tile{position:absolute;width:250px;height:150px;border-radius:20px;background:rgba(255,255,255,.08);border:2px solid rgba(183,173,152,.55);padding:20px 22px;color:#fff}
.arch{position:absolute;border-radius:999px 999px 30px 30px;background:linear-gradient(170deg,#27507A 0%,#152F4A 65%,#0F2338 100%);box-shadow:0 30px 60px rgba(21,47,74,.25)}
</style>
</head>
<body>
<div id="stage">
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4DCCB"/><stop offset=".45" stop-color="#B7AD98"/><stop offset=".7" stop-color="#9C9179"/><stop offset="1" stop-color="#CFC6B3"/></linearGradient>
  <linearGradient id="navyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E5A86"/><stop offset=".5" stop-color="#152F4A"/><stop offset="1" stop-color="#1D3D5F"/></linearGradient>
  <linearGradient id="towerG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1B3A5B"/><stop offset=".55" stop-color="#152F4A"/><stop offset="1" stop-color="#0F2338"/></linearGradient>
  <linearGradient id="glassT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A6F93"/><stop offset="1" stop-color="#27486A"/></linearGradient>
  <linearGradient id="glassL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3E9EE"/><stop offset="1" stop-color="#B9C6D2"/></linearGradient>
  <linearGradient id="winGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF4E6"/><stop offset="1" stop-color="#E2CFAE"/></linearGradient>
  <radialGradient id="warmG" cx="50%" cy="60%" r="70%"><stop offset="0" stop-color="#FFF9EE"/><stop offset=".6" stop-color="#EADFC8"/><stop offset="1" stop-color="#C9B998"/></radialGradient>
  <pattern id="pgrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2DED5" stroke-width="1.5"/></pattern>
  <g id="em0" fill="none" stroke="#152F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="-15" y="-12" width="30" height="20" rx="2"/><path d="M-6 13H6M0 8V13"/><path d="M-9 2L-3 -4L2 0L9 -7"/></g>
  <g id="em1" fill="none" stroke="#152F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-14 -5H12M7 -10L12 -5L7 0"/><path d="M14 6H-12M-7 1L-12 6L-7 11"/></g>
  <g id="em2" fill="none" stroke="#152F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-14 15V-8L0 -16L14 -8V15Z"/><path d="M-7 -4H-2M2 -4H7M-7 4H-2M2 4H7"/><path d="M-3 15V10H3V15"/></g>
  <g id="em3" fill="none" stroke="#152F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><circle r="6"/><path d="M0 -15V-10M0 10V15M-15 0H-10M10 0H15M-10.6 -10.6L-7 -7M7 7L10.6 10.6M-10.6 10.6L-7 7M7 -7L10.6 -10.6"/></g>
  <g id="em4" fill="none" stroke="#152F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-14 14H15"/><path d="M-10 14V4M-2 14V-2M6 14V-8"/><path d="M-13 -2L-3 -10L3 -5L13 -14M7 -14H13V-8"/></g>
  <!-- key: bow centre (0,0), tip x=234 ; navy + sand -->
  <g id="keyBody">
    <circle r="47" fill="url(#sandG)"/>
    <circle r="39" fill="url(#navyG)"/>
    <circle r="31" fill="#fff"/>
    <rect x="42" y="-9" width="192" height="18" rx="5" fill="url(#navyG)"/>
    <rect x="44" y="-9" width="190" height="4" rx="2" fill="#B7AD98" opacity=".8"/>
    <rect x="54" y="-16" width="12" height="32" rx="3" fill="url(#sandG)"/>
    <rect x="72" y="-16" width="6" height="32" rx="2" fill="url(#sandG)"/>
    <path d="M168 8V40H184V26H196V40H212V8Z" fill="url(#navyG)"/>
    <path d="M168 36H184M196 36H212" stroke="#B87955" stroke-width="4"/>
  </g>
</defs></svg>

<svg id="bg" class="abs" style="left:0;top:0" width="1080" height="1920">
  <g id="bgA" fill="none" stroke="#E4E1DA" stroke-width="2"><circle r="430"/><circle r="480" stroke-dasharray="3 14"/></g>
  <g id="bgB" fill="none" stroke="#B7AD98" stroke-width="1.5" opacity=".4"><rect x="-150" y="-150" width="300" height="300"/></g>
</svg>

<!-- ============ SCENE 1 ============ -->
<div id="s1" class="layer">
  <svg id="sky" class="abs" style="left:-260px;top:1080px" width="1600" height="840" viewBox="0 0 1600 840"></svg>
  <div id="ph1" class="abs" style="left:0;top:0;width:1080px;height:1920px">
    <div id="arch1" class="arch" style="left:250px;top:560px;width:580px;height:740px;transform-origin:50% 100%"></div>
    <svg id="archP" class="abs" style="left:250px;top:560px" width="580" height="740"></svg>
    <div class="abs" style="left:190px;top:0;width:700px;height:1300px;overflow:hidden"><img id="lead" src="assets/leader.png" style="position:absolute;left:30px;top:446px;width:640px;height:auto"></div>
    <div id="ld1" class="abs ctr h" style="top:1350px;font-size:46px;font-weight:600;color:var(--sdd)">بقيادة الأستاذ</div>
    <div id="ld2" class="abs ctr h wr" style="top:1418px;font-size:78px;font-weight:800;color:var(--n)">محمد عبدالله الشعلان</div>
    <div id="ldl" class="abs" style="left:340px;top:1535px;width:400px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(183,173,152,0),#B87955,rgba(183,173,152,0))"></div>
  </div>
  <div id="lg1" class="abs card" style="left:120px;top:150px;width:840px;height:280px;border-radius:26px;display:flex;align-items:center;justify-content:center">
    <img id="lg1i" src="assets/logo.png" style="width:760px;height:auto">
  </div>
  <div id="lg1s" class="abs ctr" style="top:455px;font-size:38px;font-weight:600;color:var(--n)">بقيادة الأستاذ محمد عبدالله الشعلان</div>
  <div id="t1wrap" class="abs" style="left:240px;top:600px;width:600px;height:980px"></div>
  <div id="flash" class="abs" style="left:0;top:0;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,238,.95),rgba(183,173,152,0))"></div>
</div>

<div id="scenes"></div>

<!-- ============ SCENE 7 ============ -->
<div id="s7" class="layer">
  <div id="h7a" class="abs ctr h wr" style="top:190px;font-size:96px;font-weight:800;color:var(--n)">الشعلان العقارية...</div>
  <div id="h7b" class="abs ctr h wr" style="top:330px;font-size:66px;font-weight:700;color:var(--n)">خبرة <span class="cu">تصنع الفرص،</span></div>
  <div id="h7c" class="abs ctr h wr" style="top:425px;font-size:66px;font-weight:700;color:var(--n)">وثقة <span class="sd">تبني المستقبل.</span></div>
  <div id="rays" class="abs" style="left:240px;top:950px;width:600px;height:600px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,248,232,.95),rgba(226,207,174,.4) 50%,rgba(226,207,174,0))"></div>
  <div id="t7wrap" class="abs" style="left:240px;top:600px;width:600px;height:980px"></div>
</div>

<!-- ============ END CARD ============ -->
<div id="s8" class="layer">
  <div id="lg8" class="abs card" style="left:80px;top:170px;width:920px;height:320px;border-radius:30px;display:flex;align-items:center;justify-content:center">
    <img id="lg8i" src="assets/logo.png" style="width:840px;height:auto">
  </div>
  <div id="e1" class="abs ctr h" style="top:530px;font-size:44px;font-weight:600;color:var(--n)">بقيادة الأستاذ محمد عبدالله الشعلان</div>
  <div id="ed" class="abs" style="left:390px;top:612px;width:300px;height:4px;border-radius:2px;background:linear-gradient(90deg,#B7AD98,#B87955,#B7AD98)"></div>
  <div id="e2" class="abs ctr h wr" style="top:660px;font-size:68px;font-weight:800;color:var(--n)">خبرة تصنع الفرص...</div>
  <div id="e3" class="abs ctr h wr" style="top:770px;font-size:68px;font-weight:800;color:var(--sdd)">وثقة تبني المستقبل.</div>
  <svg id="skyE" class="abs" style="left:0;top:880px" width="1080" height="200" viewBox="0 0 1080 200"></svg>
  <div id="cc" class="abs card" style="left:120px;top:1110px;width:840px;height:400px;border-top:8px solid var(--n)">
    <div id="cct" class="abs" style="right:56px;top:40px;font-size:40px;font-weight:600;color:var(--cu)">للتواصل والاستفسارات</div>
    <div id="r1" class="abs" style="right:56px;top:130px;height:92px;display:flex;align-items:center;gap:30px">
      <svg width="84" height="84" viewBox="-42 -42 84 84"><circle r="41" fill="#152F4A"/><circle r="36" fill="none" stroke="#B7AD98" stroke-width="2"/><path d="M-13 -18c-3 0-7 3-6 8 2 12 12 23 25 27 5 1 8-2 8-6v-5l-10-5-4 5c-7-3-11-8-14-14l5-5-4-9z" fill="#fff"/></svg>
      <div dir="ltr" style="font-family:PlexLat,PlexAr;font-size:66px;font-weight:600;color:var(--n);letter-spacing:2px">0599818181</div>
    </div>
    <div id="r2" class="abs" style="right:56px;top:258px;height:92px;display:flex;align-items:center;gap:30px">
      <svg width="84" height="84" viewBox="-42 -42 84 84"><circle r="41" fill="#152F4A"/><circle r="36" fill="none" stroke="#B7AD98" stroke-width="2"/><g fill="none" stroke="#fff" stroke-width="3"><circle r="20"/><ellipse rx="9" ry="20"/><path d="M-20 0H20M-17 -10H17M-17 10H17"/></g></svg>
      <div dir="ltr" style="font-family:PlexLat,PlexAr;font-size:62px;font-weight:600;color:var(--n)">alshalaan.sa</div>
    </div>
  </div>
  <div id="endKeys" class="abs" style="left:0;top:1580px;width:1080px;height:120px"></div>
</div>

<div id="tracker" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
<div id="keys" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
<div id="wipe" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function tf(el,o,x=0,y=0,s=1,extra=''){el.style.opacity=o;el.style.visibility=o<=.001?'hidden':'visible';el.style.transform=`translate(${x}px,${y}px) scale(${s}) ${extra}`;}
function vis(el,on){el.style.display=on?'block':'none'}
function splitWords(){document.querySelectorAll('.wr').forEach(el=>{const walk=n=>{[...n.childNodes].forEach(c=>{
  if(c.nodeType===3){const fr=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p))fr.appendChild(document.createTextNode(p));else{const s=document.createElement('span');s.className='w';s.textContent=p;fr.appendChild(s);}});c.replaceWith(fr);}
  else if(c.nodeType===1&&c.tagName!=='BR'){if(c.tagName==='SPAN'&&!c.classList.contains('w'))c.classList.add('w');else walk(c);}});};walk(el);});}
function words(el,t,st,stag=.1,dur=.55,dy=34){el.querySelectorAll('.w').forEach((w,i)=>{const e=eo(P(t,st+i*stag,st+i*stag+dur));w.style.opacity=e;w.style.transform=`translateY(${(1-e)*dy}px)`;w.style.filter=e<1?`blur(${(1-e)*7}px)`:'none';});}
function dashA(el,k,len=1000){el.setAttribute('stroke-dasharray',len);el.setAttribute('stroke-dashoffset',len*(1-k));}

// ---------- tower ----------
function tower(id){
  let win='';for(let r=0;r<24;r++)for(let c=0;c<6;c++){const x=-150+c*50,y=-660+r*28;win+=`<rect x="${x}" y="${y}" width="40" height="20" fill="${(r*7+c*3)%11===0?'#5D82A6':'url(#glassT)'}"/>`;}
  let glow='';for(let r=0;r<24;r++)for(let c=0;c<6;c++){if((r*5+c*7)%4!==0)continue;glow+=`<rect class="gw" data-k="${(r*13+c*29)%100}" x="${-150+c*50}" y="${-660+r*28}" width="40" height="20" fill="url(#winGlow)" opacity="0"/>`;}
  return `<svg id="${id}" width="100%" height="100%" viewBox="-300 -760 600 980" style="overflow:visible">
   <ellipse cx="0" cy="212" rx="300" ry="16" fill="rgba(21,47,74,.14)"/>
   <rect x="-262" y="-330" width="96" height="370" fill="#E9ECEE"/>${[0,1,2,3,4,5,6,7].map(r=>`<rect x="-246" y="${-306+r*42}" width="64" height="24" fill="url(#glassL)"/>`).join('')}
   <rect x="166" y="-220" width="96" height="260" fill="#F3F1EC" stroke="#DAD6CC" stroke-width="2"/>${[0,1,2,3,4].map(r=>`<rect x="182" y="${-198+r*46}" width="64" height="26" fill="#2B4D70"/>`).join('')}
   <rect x="-176" y="-712" width="352" height="756" fill="url(#towerG)"/>
   ${win}<g id="${id}gw">${glow}</g>
   ${[-170,-110,-60,-10,40,90,140,170].map(x=>`<rect x="${x-2}" y="-700" width="4" height="740" fill="#B7AD98" opacity=".75"/>`).join('')}
   <rect x="-186" y="-728" width="372" height="22" fill="#B7AD98"/><rect x="-130" y="-760" width="260" height="34" fill="#152F4A"/><rect x="-4" y="-800" width="8" height="44" fill="#B87955"/>
   <rect x="-268" y="40" width="536" height="168" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="2"/>
   <rect x="-246" y="78" width="160" height="112" fill="url(#glassL)"/><rect x="86" y="78" width="160" height="112" fill="url(#glassL)"/>
   <path d="M-166 78V190M166 78V190" stroke="#152F4A" stroke-width="4"/>
   <rect x="-66" y="66" width="132" height="142" fill="#0E2236"/>
   <rect id="${id}in" x="-60" y="72" width="120" height="136" fill="url(#warmG)" opacity="0"/>
   <g id="${id}dl"><rect x="-60" y="72" width="60" height="136" fill="url(#glassT)" stroke="#B7AD98" stroke-width="3"/><rect x="-12" y="120" width="5" height="40" rx="2" fill="#B87955"/></g>
   <g id="${id}dr"><rect x="0" y="72" width="60" height="136" fill="url(#glassT)" stroke="#B7AD98" stroke-width="3"/><rect x="7" y="120" width="5" height="40" rx="2" fill="#B87955"/></g>
   <rect x="-122" y="44" width="244" height="14" fill="#152F4A"/><rect x="-122" y="58" width="244" height="4" fill="#B87955"/>
   <rect x="-280" y="204" width="560" height="10" fill="#DAD6CC"/>
  </svg>`;}
function villa(){return `<svg width="100%" height="100%" viewBox="-300 -200 600 420" style="overflow:visible"><ellipse cx="0" cy="200" rx="290" ry="14" fill="rgba(21,47,74,.13)"/>
  <rect x="-270" y="20" width="330" height="170" fill="#fff" stroke="#DAD6CC" stroke-width="2"/><rect x="40" y="60" width="220" height="130" fill="#F3F1EC"/>${[...Array(8)].map((_,i)=>`<rect x="${56+i*25}" y="78" width="10" height="100" fill="#B7AD98" opacity=".7"/>`).join('')}
  <rect x="-250" y="50" width="130" height="120" fill="url(#glassL)"/><rect x="-250" y="50" width="130" height="120" fill="none" stroke="#152F4A" stroke-width="5"/>
  <rect x="-90" y="70" width="70" height="120" fill="#152F4A"/><rect x="-34" y="118" width="5" height="30" fill="#B87955"/>
  <rect x="-170" y="-120" width="360" height="140" fill="#F7F6F2" stroke="#DAD6CC" stroke-width="2"/><rect x="-140" y="-96" width="240" height="94" fill="url(#glassL)"/><rect x="-140" y="-96" width="240" height="94" fill="none" stroke="#152F4A" stroke-width="5"/>
  <rect x="-190" y="-140" width="400" height="22" fill="#152F4A"/><rect x="-282" y="6" width="130" height="16" fill="#152F4A"/><rect x="30" y="46" width="242" height="14" fill="#152F4A"/><rect x="-190" y="-118" width="400" height="4" fill="#B87955"/></svg>`;}
function block(id){let w='';for(let r=0;r<6;r++)for(let c=0;c<4;c++)w+=`<rect class="bw" x="${-120+c*62}" y="${-260+r*66}" width="46" height="44" fill="url(#glassL)"/><rect class="bg2" data-i="${r*4+c}" x="${-120+c*62}" y="${-260+r*66}" width="46" height="44" fill="url(#winGlow)" opacity="0"/>`;
  return `<svg id="${id}" width="100%" height="100%" viewBox="-200 -330 400 560" style="overflow:visible"><ellipse cx="0" cy="214" rx="190" ry="12" fill="rgba(21,47,74,.13)"/>
  <rect x="-150" y="-290" width="300" height="500" fill="#152F4A"/>${w}<rect x="-160" y="-310" width="320" height="24" fill="#B7AD98"/>
  <rect x="-40" y="140" width="80" height="70" fill="#0E2236"/><rect x="-40" y="140" width="80" height="70" fill="none" stroke="#B7AD98" stroke-width="3"/><rect x="-160" y="206" width="320" height="8" fill="#DAD6CC"/></svg>`;}
$('t1wrap').innerHTML=tower('T1');$('t7wrap').innerHTML=tower('T7');

// skyline
(function(){let s='',s2='';let x=0;const H=[260,380,220,460,300,520,240,400,330,560,280,420,250,360,300,480,220];

function keyState(i,t){

  const angF=-90+i*72+(8.65-T1)*18; const orbF=[540+Math.cos(angF*Math.PI/180)*390, 1080+Math.sin(angF*Math.PI/180)*380];
  if(t<a){const k=eio(P(t,8.65+i*.06,9.25+i*.06));return [1,lerp(orbF[0],slot[0],k),lerp(orbF[1],slot[1],k),lerp(.62,.36,k),lerp(angF+90,-45,k),1];}

    const kin=eo5(P(t,a,a+.7)), kout=eio(P(t,b-.9,b-.3));
    const turn=P(t,TT[i]+.35,TT[i]+.95); const sy=Math.cos(turn*2*Math.PI);
    const fl=Math.sin(t*2.2)*6*kin*(1-kout);
    let x=lerp(slot[0],stage[0],kin), y=lerp(slot[1],stage[1],kin)+fl, s=lerp(.36,.95,kin), r=lerp(-45,0,kin);
    if(kout>0){x=lerp(stage[0],slot[0],kout);y=lerp(stage[1]+fl,slot[1],kout)-Math.sin(Math.PI*kout)*120;s=lerp(.95,.36,kout);r=lerp(0,-45,kout);}
    return [1,x,y,s,r,Math.abs(sy)<.08?.08*Math.sign(sy||1):sy];

}
