<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=30,DUR=48;
const NAVY='#141547',NAVY2='#0b0c2c',NAVY3='#070820',GOLD='#B38E56',GOLDL='#E6CB93',GOLDD='#8A6A3B',IVORY='#F6F1E6';
const AR='Alexandria',PX='IBM Plex Sans Arabic',CZ='Cinzel';
const cv=document.getElementById('c'),X=cv.getContext('2d');
// ---------- utils
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eo=p=>1-Math.pow(1-p,3);
const eoe=p=>p>=1?1:1-Math.pow(2,-10*p);
const eob=p=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function font(ctx,size,weight=700,fam=AR){ctx.font=`${weight} ${size}px "${fam}"`}
function goldGrad(ctx,x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#9C7743');g.addColorStop(.35,'#E9D09A');g.addColorStop(.55,'#C29A5E');g.addColorStop(.8,'#F0DCAE');g.addColorStop(1,'#A07B46');return g}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

// ---------- assets
const logo=new Image();logo.src='assets/logo.webp';
const founder=new Image();founder.src='assets/founder.webp';

// ---------- kinetic arabic text (word by word, RTL)
// spec: string with *gold* markers
function parse(str){let on=false;return str.split(' ').map(w=>{let g=on;if(w.startsWith('*')){g=true;on=true;w=w.slice(1)}if(w.endsWith('*')){w=w.slice(0,-1);on=false}return{w,g}})}
function kLine(ctx,str,cx,y,t,t0,o={}){
  const size=o.size||84,weight=o.weight||700,fam=o.fam||AR,col=o.color||'#fff',gcol=o.gold||null,st=o.stagger??.075,dur=o.dur??.7;
  const tOut=o.tOut??1e9,outD=o.outD??.45;
  if(t<t0)return;
  const out=1-eio(P(t,tOut,tOut+outD));
  if(out<=0)return;
  font(ctx,size,weight,fam);ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='alphabetic';
  const ws=parse(str);const sp=ctx.measureText(' ').width*1.05;
  const widths=ws.map(w=>ctx.measureText(w.w).width);const tot=widths.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  let xr=(o.align==='right'?cx:cx+tot/2);
  ws.forEach((w,i)=>{
    const p=eo(P(t,t0+i*st,t0+i*st+dur));
    if(p>0){
      ctx.save();ctx.globalAlpha=(o.alpha??1)*p*out;
      const dy=(1-p)*(o.rise??38)+(1-out)*-14;
      if(p<1&&!o.noblur)ctx.filter=`blur(${(1-p)*9}px)`;
      if(o.shadow){ctx.shadowColor=o.shadow;ctx.shadowBlur=24;}
      ctx.fillStyle=w.g?(gcol||goldGrad(ctx,xr-widths[i],y-size,xr,y)):col;
      ctx.fillText(w.w,xr,y+dy);
      ctx.restore();
    }
    xr-=widths[i]+sp;
  });
  return tot;
}
function sText(ctx,str,x,y,size,weight,fam,col,align='center',alpha=1,dir='rtl'){ctx.save();ctx.globalAlpha=alpha;font(ctx,size,weight,fam);ctx.direction=dir;ctx.textAlign=align;ctx.fillStyle=col;ctx.fillText(str,x,y);ctx.restore()}

// ---------- shape helpers
function bez(p0,p1,p2,p3,n,out){for(let i=1;i<=n;i++){const t=i/n,u=1-t;out.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]])}}
function shieldDense(cx,y0,w,h){
  const L=[],hw=w/2;const s=[cx,y0+h*.045];L.push(s);
  bez(s,[cx+hw*.35,y0+h*.045],[cx+hw*.75,y0+h*.03],[cx+hw,y0],20,L);
  bez([cx+hw,y0],[cx+hw,y0+h*.15],[cx+hw,y0+h*.3],[cx+hw,y0+h*.44],12,L);
  bez([cx+hw,y0+h*.44],[cx+hw,y0+h*.75],[cx+hw*.45,y0+h*.9],[cx,y0+h],30,L);
  bez([cx,y0+h],[cx-hw*.45,y0+h*.9],[cx-hw,y0+h*.75],[cx-hw,y0+h*.44],30,L);
  bez([cx-hw,y0+h*.44],[cx-hw,y0+h*.3],[cx-hw,y0+h*.15],[cx-hw,y0],12,L);
  bez([cx-hw,y0],[cx-hw*.75,y0+h*.03],[cx-hw*.35,y0+h*.045],s,20,L);return L}
function rectDense(cx,y0,w,h){const hw=w/2,L=[];const pts=[[cx,y0],[cx+hw,y0],[cx+hw,y0+h],[cx-hw,y0+h],[cx-hw,y0],[cx,y0]];for(let k=0;k<5;k++){const a=pts[k],b=pts[k+1];for(let i=0;i<20;i++){const t=i/20;L.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t)])}}L.push([cx,y0]);return L}
function resample(L,n){const d=[0];for(let i=1;i<L.length;i++)d.push(d[i-1]+Math.hypot(L[i][0]-L[i-1][0],L[i][1]-L[i-1][1]));const tot=d[d.length-1],o=[];let j=0;for(let i=0;i<n;i++){const s=tot*i/n;while(d[j+1]<s)j++;const t=(s-d[j])/((d[j+1]-d[j])||1);o.push([lerp(L[j][0],L[j+1][0],t),lerp(L[j][1],L[j+1][1],t)])}return o}
function polyPath(ctx,pts,frac=1){ctx.beginPath();const n=Math.max(2,Math.floor(pts.length*frac));ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(frac>=1)ctx.closePath()}
function shield(ctx,cx,y0,w,h,draw,fill,t){ // draw: 0..1 stroke progress, fill: 0..1
  const pts=resample(shieldDense(cx,y0,w,h),240);
  if(fill>0){polyPath(ctx,pts,1);const g=ctx.createLinearGradient(cx,y0,cx,y0+h);g.addColorStop(0,`rgba(230,203,147,${.22*fill})`);g.addColorStop(.6,`rgba(179,142,86,${.10*fill})`);g.addColorStop(1,`rgba(179,142,86,${.02*fill})`);ctx.fillStyle=g;ctx.fill()}
  if(draw>0){
    // two halves drawing from top center down to bottom point symmetric
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
    const half=pts.length/2;
    for(const pass of [[26,'rgba(230,203,147,.35)',12],[0,'#F1DCA8',4]]){
      ctx.shadowColor=GOLDL;ctx.shadowBlur=pass[0];ctx.strokeStyle=pass[1];ctx.lineWidth=pass[2];
      const n=Math.floor(half*draw);
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=n;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
      ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=n;i++){const q=pts[(pts.length-i)%pts.length];ctx.lineTo(q[0],q[1])}ctx.stroke();
    }
    // inner line
    if(draw>=1&&fill>0){const p2=resample(shieldDense(cx,y0+h*.05,w*.86,h*.9),200);polyPath(ctx,p2,1);ctx.shadowBlur=0;ctx.strokeStyle=`rgba(230,203,147,${.5*fill})`;ctx.lineWidth=1.6;ctx.stroke()}
    ctx.restore();
  }
}

// ---------- particles
const DUST=[...Array(90)].map((_,i)=>({x:hash(i)*W,y:hash(i+99)*H,r:1+hash(i+7)*3.2,s:8+hash(i+3)*22,ph:hash(i+5)*6.28,a:.15+hash(i+11)*.5}));
function dust(ctx,t,col='230,203,147',mult=1){ctx.save();ctx.globalCompositeOperation='lighter';for(const d of DUST){const y=(d.y-t*d.s+H*10)%H,x=d.x+Math.sin(t*.4+d.ph)*20;const a=d.a*(.6+.4*Math.sin(t*1.3+d.ph))*mult;const g=ctx.createRadialGradient(x,y,0,x,y,d.r*4);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fillRect(x-d.r*4,y-d.r*4,d.r*8,d.r*8)}ctx.restore()}

// ---------- 2.5D building
function building(ctx,cx,base,w,h,o={}){
  if(h<=1)return;const d=o.depth??w*.28,dy=d*.42;const x0=cx-w/2,top=base-h;
  const tone=o.tone??1;
  // side face
  ctx.beginPath();ctx.moveTo(x0+w,top);ctx.lineTo(x0+w+d,top-dy);ctx.lineTo(x0+w+d,base-dy);ctx.lineTo(x0+w,base);ctx.closePath();
  let g=ctx.createLinearGradient(0,top,0,base);g.addColorStop(0,`rgba(${18*tone|0},${20*tone|0},${62*tone|0},1)`);g.addColorStop(1,`rgba(8,9,30,1)`);ctx.fillStyle=g;ctx.fill();
  // top
  ctx.beginPath();ctx.moveTo(x0,top);ctx.lineTo(x0+d,top-dy);ctx.lineTo(x0+w+d,top-dy);ctx.lineTo(x0+w,top);ctx.closePath();ctx.fillStyle=`rgba(${60*tone|0},${62*tone|0},${120*tone|0},1)`;ctx.fill();
  // front
  g=ctx.createLinearGradient(x0,top,x0+w,base);g.addColorStop(0,`rgba(${46*tone|0},${50*tone|0},${118*tone|0},1)`);g.addColorStop(.55,`rgba(${26*tone|0},${28*tone|0},${82*tone|0},1)`);g.addColorStop(1,`rgba(${14*tone|0},${15*tone|0},${48*tone|0},1)`);
  ctx.fillStyle=g;ctx.fillRect(x0,top,w,h);
  // glass reflection band
  ctx.save();ctx.beginPath();ctx.rect(x0,top,w,h);ctx.clip();const rf=ctx.createLinearGradient(x0,top,x0+w,top+h*.6);const sh=(o.shine??0);rf.addColorStop(clamp(sh-.15),'rgba(255,255,255,0)');rf.addColorStop(clamp(sh),`rgba(230,203,147,${.16*tone})`);rf.addColorStop(clamp(sh+.15),'rgba(255,255,255,0)');ctx.fillStyle=rf;ctx.fillRect(x0,top,w,h);
  // windows
  if(o.win!==false){const cols=Math.max(2,Math.round(w/(o.ws||22))),cw=w/cols,rows=Math.floor(h/(o.wh||30));const seed=o.seed||1;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const hv=hash(seed*31+r*7.13+c*3.7);if(hv<.55)continue;const tw=.5+.5*Math.sin((o.t||0)*.9+hv*40);const a=(hv>.9?.75:.28)*(.7+.3*tw)*tone;ctx.fillStyle=hv>.93?`rgba(240,214,160,${a})`:`rgba(170,180,240,${a*.55})`;ctx.fillRect(x0+c*cw+cw*.22,base-(r+1)*(o.wh||30)+6,cw*.56,(o.wh||30)*.55)}}
  ctx.restore();
  if(o.edge){ctx.save();ctx.strokeStyle=o.edge;ctx.lineWidth=2;ctx.shadowColor=GOLDL;ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(x0+w,base);ctx.lineTo(x0+w,top);ctx.lineTo(x0+w+d,top-dy);ctx.moveTo(x0,top);ctx.lineTo(x0+w,top);ctx.stroke();ctx.restore()}
}
// paper document
function paper(ctx,x,y,w,h,rot,alpha,o={}){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;
  const g=ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);g.addColorStop(0,'#FBF8F1');g.addColorStop(1,'#E9E2D2');ctx.fillStyle=g;rr(ctx,-w/2,-h/2,w,h,w*.03);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle=GOLD;ctx.fillRect(-w*.38,-h*.42,w*.76,Math.max(2,h*.012));
  const n=o.lines??9;for(let i=0;i<n;i++){const ly=-h*.32+i*(h*.68/n);const lw=w*(i%3==2?.5:.76)*(o.reveal!==undefined?clamp(o.reveal*n-i):1);ctx.fillStyle='rgba(20,21,71,.28)';ctx.fillRect(w*.38-lw,ly,lw,Math.max(2,h*.014))}
  ctx.restore()}

// ---------- background helpers
function navyBG(ctx,t,glowY=1300){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,NAVY3);g.addColorStop(.55,'#121443');g.addColorStop(1,'#0a0b27');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const r=ctx.createRadialGradient(540,glowY,10,540,glowY,900);r.addColorStop(0,'rgba(179,142,86,.28)');r.addColorStop(.5,'rgba(179,142,86,.06)');r.addColorStop(1,'rgba(179,142,86,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,H)}
function perspGrid(ctx,t,y0,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='rgba(179,142,86,.35)';ctx.lineWidth=1.2;const vx=540;
  for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(vx+i*14,y0);ctx.lineTo(vx+i*190,H);ctx.stroke()}
  for(let k=0;k<14;k++){const p=((k+(t*.35)%1)/14);const y=y0+Math.pow(p,2.2)*(H-y0);ctx.globalAlpha=alpha*p;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore()}
function archLines(ctx,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=GOLD;ctx.lineWidth=1.2;
  for(let i=0;i<7;i++){const x=90+i*150;ctx.beginPath();ctx.moveTo(x-50,H);ctx.lineTo(x-50,900);ctx.arc(x,900,50,Math.PI,0);ctx.lineTo(x+50,H);ctx.stroke()}ctx.restore()}

// =============== SCENE 1: business hook (0-10.3)
const R1=rng(7);
const CITY=[];
for(let L=0;L<3;L++){const n=[16,11,7][L];for(let i=0;i<n;i++){const x=(i+.5)/n*W*1.3-W*.15+(R1()-.5)*60;if(L==2&&Math.abs(x-540)<170)continue;CITY.push({L,x,w:[60,95,140][L]*(.7+R1()*.6),h:[380,560,700][L]*(.55+R1()*.6),d:.1+R1()*1.6+L*.5,seed:L*100+i})}}
const FLOAT=[...Array(6)].map((_,i)=>({x:(i%2?820:260)+(hash(i+40)-.5)*200,y:900+hash(i+50)*700,r:(hash(i+60)-.5)*.8,s:.55+hash(i+70)*.6,ph:hash(i+80)*6,dl:.6+i*.35}));
function scene1(ctx,T){
  const t=T;navyBG(ctx,t,1380);
  // stars/sky line grid
  dust(ctx,t,'230,203,147',.8);
  let sc=1+.16*eio(P(t,0,9.6));const zin=eio(P(t,9.55,10.3));sc*=1+zin*2.4;
  ctx.save();ctx.translate(540,1000);ctx.scale(sc,sc);ctx.translate(-540,-1000-30*P(t,0,10));
  const base=1520;
  // horizon glow
  const hg=ctx.createRadialGradient(540,base,0,540,base,700);hg.addColorStop(0,'rgba(233,208,154,.35)');hg.addColorStop(1,'rgba(233,208,154,0)');ctx.fillStyle=hg;ctx.fillRect(-200,base-700,1480,1100);
  for(const L of [0,1]){const par=[.4,.7][L];ctx.save();ctx.translate((t*6)*par*(L?1:-1),0);
    for(const b of CITY.filter(b=>b.L==L)){const p=eo(P(t,b.d*.35,b.d*.35+1.4));building(ctx,b.x,base-10*(1-L),b.w,b.h*p,{tone:[.55,.8][L],seed:b.seed,t,ws:L?20:16,wh:L?28:22})}
    ctx.restore();
    // haze
    ctx.fillStyle=`rgba(11,12,39,${L?.18:.35})`;ctx.fillRect(-200,base-900,1480,900);
  }
  // central tower
  const tp=eo(P(t,.1,2.2));const th=900*tp;
  building(ctx,540,base,190,th,{tone:1.15,seed:777,t,ws:24,wh:30,edge:tp>.2?'rgba(230,203,147,.9)':null,shine:P(t,2.5,6)*1.4-.2,depth:60});
  if(tp>.9){ctx.save();ctx.strokeStyle=GOLDL;ctx.lineWidth=3;ctx.shadowColor=GOLDL;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(570,base-th-12);ctx.lineTo(570,base-th-12-120*eo(P(t,2.4,3.2)));ctx.stroke();ctx.restore()}
  for(const b of CITY.filter(b=>b.L==2)){const p=eo(P(t,b.d*.3,b.d*.3+1.2));ctx.save();ctx.translate(t*9*(b.x<540?-1:1),0);building(ctx,b.x,base+10,b.w,b.h*p,{tone:1,seed:b.seed,t,ws:26,wh:34});ctx.restore()}
  // ground
  const gg=ctx.createLinearGradient(0,base,0,base+500);gg.addColorStop(0,'#1b1d55');gg.addColorStop(1,'#07081d');ctx.fillStyle=gg;ctx.fillRect(-300,base,1680,600);
  ctx.strokeStyle='rgba(230,203,147,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-300,base);ctx.lineTo(1380,base);ctx.stroke();
  perspGridLocal(ctx,t,base);
  // network lines between rooftops
  const np=P(t,1.8,5);if(np>0){ctx.save();ctx.strokeStyle='rgba(230,203,147,.55)';ctx.lineWidth=1.5;ctx.shadowColor=GOLDL;ctx.shadowBlur=8;
    const nodes=CITY.filter(b=>b.L==1).map(b=>[b.x+(t*6)*.7,base-b.h]).filter(n=>n[0]>0&&n[0]<W);nodes.push([540,base-th]);
    for(let i=0;i<nodes.length-1;i++){const a=nodes[i],b=nodes[(i+3)%nodes.length];const q=clamp(np*nodes.length-i*.6);if(q<=0)continue;ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(lerp(a[0],b[0],q),lerp(a[1],b[1],q));ctx.stroke();ctx.fillStyle=GOLDL;ctx.beginPath();ctx.arc(a[0],a[1],4,0,7);ctx.fill()}
    ctx.restore()}
  // shield around tower
  const sd=eio(P(t,4.9,7.4)),sf=eo(P(t,6.8,8.4));
  if(sd>0){const pulse=1+.012*Math.sin(t*4)*sf;ctx.save();ctx.translate(540,base-520);ctx.scale(pulse,pulse);ctx.translate(-540,-(base-520));shield(ctx,555,base-900,500,960,sd,sf,t);ctx.restore()}
  ctx.restore();
  // floating contracts (foreground parallax)
  for(const f of FLOAT){const a=eo(P(t,f.dl,f.dl+1))*(1-P(t,9,9.8));if(a<=0)continue;const y=f.y-t*22*f.s,x=f.x+Math.sin(t*.6+f.ph)*30;paper(ctx,x,y,110*f.s,145*f.s,f.r+Math.sin(t*.5+f.ph)*.08,a*.85,{lines:7})}
  // headlines
  const ty=300;
  kLine(ctx,'في عالم *الأعمال...*',540,ty,t,.15,{size:104,tOut:1.25,shadow:'rgba(0,0,0,.5)'});
  kLine(ctx,'حيث تتشابك المصالح،',540,ty-40,t,1.45,{size:86,tOut:4.55,shadow:'rgba(0,0,0,.5)'});
  kLine(ctx,'وتُصنع *القرارات...*',540,ty+80,t,3.3,{size:86,tOut:4.55,shadow:'rgba(0,0,0,.5)'});
  kLine(ctx,'تحتاج أعمالك إلى',540,ty-60,t,4.85,{size:78,weight:600,tOut:9.5,shadow:'rgba(0,0,0,.5)'});
  kLine(ctx,'*شريك قانوني*',540,ty+75,t,5.2,{size:104,tOut:9.5,shadow:'rgba(0,0,0,.5)'});
  kLine(ctx,'يحمي مصالحك.',540,ty+190,t,7.4,{size:78,weight:600,tOut:9.5,shadow:'rgba(0,0,0,.5)'});
  // flash into tower
  if(zin>0){ctx.fillStyle=`rgba(246,241,230,${eio(P(t,9.85,10.3))})`;ctx.fillRect(0,0,W,H)}
}
function perspGridLocal(ctx,t,base){ctx.save();ctx.strokeStyle='rgba(179,142,86,.18)';ctx.lineWidth=1.2;for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(540+i*40,base);ctx.lineTo(540+i*260,base+500);ctx.stroke()}ctx.restore()}

// =============== SCENE 2: firm + founder (10.0-16.6)
function ivoryBG(ctx,t,a=1){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FBF8F2');g.addColorStop(1,'#EFE7D6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const r=ctx.createRadialGradient(540,700,0,540,700,900);r.addColorStop(0,'rgba(255,255,255,.9)');r.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,H);
