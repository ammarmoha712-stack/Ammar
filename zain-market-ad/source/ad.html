<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=Noto+Sans+Arabic:wght@600;800;900&display=block" rel="stylesheet">
<style>
:root{--red:#B91F2B;--green:#098D4C;--white:#F7F7F2;--ink:#2a1414}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--white)}
#stage{position:absolute;inset:0;overflow:hidden;font-family:'Alexandria','Noto Sans Arabic',sans-serif;background:radial-gradient(120% 70% at 50% 38%,#ffffff 0%,#F7F7F2 55%,#e9e8df 100%)}
.layer{position:absolute;inset:0}
.a{position:absolute;left:0;top:0;will-change:transform,opacity}
.e{font-family:'Noto Color Emoji';line-height:1;filter:drop-shadow(0 18px 18px rgba(60,20,20,.22))}
.title{position:absolute;left:50px;right:50px;text-align:center;direction:rtl;font-weight:900;line-height:1.55}
.title span{display:inline-block;margin:0 10px}
.floor{position:absolute;left:-10%;right:-10%;bottom:0;height:46%;background:linear-gradient(#ecebe3,#dddbd0);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(70,30,30,.35),rgba(70,30,30,0))}
.pill{display:inline-block;padding:18px 44px;border-radius:999px;background:#fff;box-shadow:0 20px 50px rgba(120,30,30,.16)}
.leaf{width:200px;height:110px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#19b062,#098D4C 60%,#066b39);box-shadow:0 10px 30px rgba(9,141,76,.35)}
.leaf::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:4px;background:rgba(255,255,255,.75);transform:rotate(-24deg);border-radius:4px}
.apple{width:220px;height:220px;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;background:radial-gradient(circle at 34% 30%,#ff8b8b 0%,#e33a44 22%,#B91F2B 55%,#7d0f19 100%)}
.tag{width:310px;white-space:nowrap;height:120px;background:var(--red);border-radius:16px 60px 60px 16px;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:34px;box-shadow:0 18px 40px rgba(185,31,43,.35)}
.tag::before{content:"";width:22px;height:22px;border-radius:50%;background:#F7F7F2;position:absolute;right:26px}
.ped{position:absolute;width:300px;height:150px}
.ped .top{position:absolute;left:0;right:0;top:0;height:70px;border-radius:50%;background:linear-gradient(#fff,#efeee8);box-shadow:inset 0 -6px 12px rgba(0,0,0,.06)}
.ped .body{position:absolute;left:0;right:0;top:35px;height:140px;background:linear-gradient(90deg,#e7e5dc,#ffffff 45%,#dedcd2);border-radius:0 0 150px 150px/0 0 35px 35px}
.card{background:#fff;border-radius:44px;box-shadow:0 30px 80px rgba(120,30,30,.18)}
</style></head>
<body><div id="stage"></div>
<script>
const W=1080,H=1920,S=document.getElementById('stage');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function mk(parent,html,cls,style){const d=document.createElement('div');d.className=cls||'a';if(html)d.innerHTML=html;if(style)d.style.cssText+=style;parent.appendChild(d);return d}
function layer(){return mk(S,'','layer')}
function put(el,x,y,s=1,r=0,o=1,extra=''){el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${r}deg) ${extra}`;el.style.opacity=o}
function emo(parent,ch,size){return mk(parent,ch,'a e',`font-size:${size}px`)}
// kinetic title
function title(parent,str,y,size,color,pill){
  const d=mk(parent,'','title',`top:${y}px;font-size:${size}px;color:${color}`);
  const inner=pill?mk(d,'','pill'):d;
  str.split(' ').forEach(w=>{const s=document.createElement('span');s.textContent=w;inner.appendChild(s)});
  d._w=[...inner.querySelectorAll('span')];d._inner=inner;return d}
function anim(d,t,a,b){
  const any=t>a-0.01&&t<b+0.01;d.style.display=any?'block':'none';if(!any)return;
  const out=eio(P(t,b-0.35,b));
  if(d._inner!==d){const q=eo(P(t,a,a+0.4));d._inner.style.transform=`scale(${lerp(.85,1,back(q))})`;d._inner.style.opacity=q}
  d._w.forEach((s,i)=>{const n=d._w.length;const st=a+(n-1-i)*0+i*0.08;const q=eo(P(t,st,st+0.5));
    s.style.opacity=q*(1-out);s.style.transform=`translateY(${(1-q)*70-out*50}px) scale(${lerp(.8,1,q)})`;s.style.filter=`blur(${(1-q)*14+out*10}px)`})}
function vis(el,on){el.style.display=on?'block':'none'}

// ============ global background bits
const BG=layer();
const bokeh=[];{const r=rnd(7);for(let i=0;i<14;i++){const sz=40+r()*160;const c=r()<.5?'185,31,43':'9,141,76';
 bokeh.push({el:mk(BG,'','a',`width:${sz}px;height:${sz}px;border-radius:50%;background:radial-gradient(closest-side,rgba(${c},.10),rgba(${c},0))`),x:r()*W,y:r()*H,sp:.3+r()*.7,ph:r()*6})}}
const coolTint=mk(BG,'','layer','background:radial-gradient(90% 60% at 50% 40%,#f2f9ff,#d7e9f5 70%,#c4dcec);opacity:0');
const warmTint=mk(BG,'','layer','background:radial-gradient(90% 60% at 50% 45%,#fffaf0,#f6ead2 70%,#ead8b6);opacity:0');
const freshTint=mk(BG,'','layer','background:radial-gradient(90% 60% at 50% 45%,#ffffff,#eaf6ee 65%,#d3ecdc);opacity:0');

// ============ SCENE 1
const L1=layer();
const s1shadow=mk(L1,'','shadow','width:620px;height:90px;left:0;top:0');
const s1cart=mk(L1,'<img src="logo_cart.png" style="width:520px;display:block">','a','filter:drop-shadow(0 30px 30px rgba(90,20,20,.25))');
const s1items=[];{const r=rnd(11);['🍚','🧀','🍎','🧴','🥫','🍊','🥛','🍝','🧽','🍇','🍞','🫑','🧃','🍗'].forEach((c,i)=>{
 s1items.push({el:emo(L1,c,120),x0:r()*W,y0:200+r()*1500,vx:(r()-.5)*900,vy:(r()-.5)*900,fx:1+r()*2,ph:r()*6,rot:(r()-.5)*90,i})})}
const bags=[emo(L1,'🛍️',150),emo(L1,'🛍️',130)];
const s1q=title(L1,'كل اللي تحتاجو في محل واحد؟',200,70,'var(--ink)');
const s1d=title(L1,'اكتشف زين ماركت!',1560,96,'var(--red)');
const sweep=mk(L1,'','a','width:1700px;height:420px;background:linear-gradient(90deg,rgba(185,31,43,0),#B91F2B 30%,#d6303c 60%,rgba(185,31,43,0))');
const trail=[];for(let i=0;i<7;i++)trail.push(mk(L1,'','a leaf',`opacity:0`));
const qmarks=[];for(let i=0;i<3;i++)qmarks.push(mk(L1,'؟','a',`font-size:160px;font-weight:900;color:var(--red)`));

// apple wipe
const appleL=layer();
const apple=mk(appleL,'','a apple');const appleLeaf=mk(apple,'','a leaf','width:110px;height:60px;left:120px;top:-30px;transform:rotate(-20deg)');
const appleHi=mk(apple,'','a','left:46px;top:40px;width:60px;height:34px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(6px)');

// ============ SCENE 2
const L2=layer();
const s2shadow=mk(L2,'','shadow','width:700px;height:110px');
const s2cart=mk(L2,'<img src="logo_cart.png" style="width:580px;display:block">','a','filter:drop-shadow(0 34px 34px rgba(90,20,20,.25))');
const s2items=['🍚','🍎','🧀','🥛','🍊','🧴','🍇','🥫','🍞','🫑','🧃','🍌'].map((c,i)=>({el:emo(L2,c,130),i}));
const s2a=title(L2,'كل شي تحتاجو',250,104,'var(--red)');
const s2b=title(L2,'إنت وأهل دارك',420,84,'var(--green)');

// ============ SCENE 3
const L3=layer();
function group(list,size){return list.map((c,i)=>({el:emo(L3,c,size),i}))}
const g1=group(['🍚','🍝','🫒','🌾','🍬','🥫','🧃','🍵','🍞'],150);
const g1peds=[0,1,2].map(()=>{const p=mk(L3,'<div class="top"></div><div class="body"></div>','a ped');return p});
const frost=[];{const r=rnd(5);for(let i=0;i<26;i++)frost.push({el:mk(L3,'','a',`width:${6+r()*12}px;height:${6+r()*12}px;border-radius:50%;background:#fff;box-shadow:0 0 12px #bfe3ff`),x:r()*W,y:r()*H,ph:r()*6})}
const g2=group(['🍗','🥩','🫛','🥦','🍤','🧊'],160);
const g3=group(['🧀','🥛','🧈','🥚','🍶'],150);
const bigCheese=emo(L3,'🧀',190);
const g4=group(['🍎','🍊','🍓','🍇','🍌','🍅','🥬','🥒','🫑','🥕','🍋','🍉','🍐','🥭'],140);
const drops=[];{const r=rnd(19);for(let i=0;i<22;i++)drops.push({el:mk(L3,'','a',`width:${10+r()*18}px;height:${14+r()*22}px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff,rgba(190,230,255,.55) 40%,rgba(120,180,220,.25));box-shadow:0 3px 8px rgba(0,60,90,.15)`),x:r()*W,y:r()*H,sp:.5+r(),ph:r()*6})}
const g4leaf=[];for(let i=0;i<6;i++)g4leaf.push(mk(L3,'','a leaf'));
const g5=group(['🧴','🧼','🧽','🫧','🧺','🪥','🧻','💧'],150);
const g5peds=[0,1,2].map(()=>mk(L3,'<div class="top"></div><div class="body"></div>','a ped'));
const glint=mk(L3,'','layer','background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 60%);opacity:0');
const s3cart=mk(L3,'<img src="logo_cart.png" style="width:520px;display:block">','a','filter:drop-shadow(0 30px 30px rgba(90,20,20,.25))');
const t3a=title(L3,'مواد غذائية',230,110,'var(--red)',true);
const t3b=title(L3,'مجمدات وأجبان',230,104,'var(--green)',true);
const t3c=title(L3,'خضرة وفواكه طازجة',230,96,'var(--green)',true);
const t3d=title(L3,'منظفات ومنتجات العناية بالبشرة',210,74,'var(--red)',true);

// ============ SCENE 4
const L4=layer();
const road=mk(L4,'','layer','top:1150px;background:linear-gradient(#efeee6,#dcdad0);');
const lanes=[];for(let i=0;i<8;i++)lanes.push(mk(L4,'','a',`width:26px;height:120px;border-radius:14px;background:${i%2?'#098D4C':'#B91F2B'};opacity:.25`));
const s4inside=['🍞','🥬','🍎','🥛','🧀','🍌','🧴','🍊'].map(c=>emo(L4,c,120));
const s4shadow=mk(L4,'','shadow','width:700px;height:110px');
const s4cart=mk(L4,'<img src="logo_cart.png" style="width:600px;display:block">','a','filter:drop-shadow(0 34px 34px rgba(90,20,20,.25))');
const tags=[0,1,2].map(()=>mk(L4,'<span style="font-size:44px">✓</span><span>سعر مناسب</span>','a tag'));
const t4a=title(L4,'أسعار مناسبة',300,120,'var(--red)');
// delivery
const D=mk(L4,'','layer','background:linear-gradient(#f6efe4,#efe3cf 70%,#e2d2b8)');
const wallLines=mk(D,'','layer','background:repeating-linear-gradient(0deg,rgba(150,110,70,.05) 0 2px,transparent 2px 120px)');
const doorFrame=mk(D,'','a','width:560px;height:1000px;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 30px 80px rgba(90,50,20,.25)');
const doorIn=mk(doorFrame,'','a','left:30px;top:30px;width:500px;height:970px;background:radial-gradient(70% 60% at 50% 40%,#fff6dd,#ffd98a 60%,#f2b85b)');
const family=mk(doorIn,'🧕','a e','font-size:240px;left:250px;top:560px;transform:translate(-50%,-50%)');
const door=mk(doorFrame,'','a','left:30px;top:30px;width:500px;height:970px;transform-origin:0 50%;background:linear-gradient(90deg,#7a4a2a,#9a6238 50%,#7a4a2a);border-radius:6px');
mk(door,'','a','left:40px;top:60px;width:420px;height:380px;border:6px solid rgba(255,255,255,.18);border-radius:8px');
mk(door,'','a','left:40px;top:500px;width:420px;height:400px;border:6px solid rgba(255,255,255,.18);border-radius:8px');
mk(door,'','a','left:420px;top:470px;width:22px;height:90px;background:#e8c46a;border-radius:12px');
const mat=mk(D,'','a','width:520px;height:70px;background:#098D4C;border-radius:14px;box-shadow:0 10px 20px rgba(0,0,0,.15)');
const plant=emo(D,'🪴',200);
const scooter=emo(D,'🛵',230);
function bagEl(parent,w){const b=mk(parent,'','a',`width:${w}px;height:${w*1.15}px`);
 mk(b,'','a',`left:${w*.28}px;top:0;width:${w*.44}px;height:${w*.3}px;border:${w*.045}px solid #8a5a2b;border-bottom:none;border-radius:${w*.2}px ${w*.2}px 0 0`);
 const body=mk(b,'','a',`left:0;top:${w*.18}px;width:${w}px;height:${w*.97}px;background:linear-gradient(90deg,#efe6d6,#fffaf1 40%,#e8dcc6);border-radius:${w*.05}px;box-shadow:0 20px 40px rgba(90,50,20,.25)`);
 mk(body,`<img src="logo_full.png" style="width:${w*.5}px;display:block">`,'a',`left:${w*.25}px;top:${w*.14}px`);
 mk(b,'🥬','a e',`font-size:${w*.32}px;left:${w*.08}px;top:${-w*.02}px;filter:none`);mk(b,'🥖','a e',`font-size:${w*.32}px;left:${w*.55}px;top:${-w*.05}px;filter:none`);
 b._body=body;return b}
const bag=bagEl(D,240);
const check=mk(D,'✓','a',`width:150px;height:150px;border-radius:50%;background:var(--green);color:#fff;font-size:100px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(9,141,76,.4)`);
const t4b=title(D,'التوصيل حتى لباب دارك!',170,88,'var(--red)',true);
const bigBag=bagEl(S,300);

// ============ SCENE 5
const L5=layer();
const s5shadow=mk(L5,'','shadow','width:600px;height:90px');
const s5inside=['🥖','🍎','🥬','🧀','🍊','🥛'].map(c=>emo(L5,c,110));
const s5cart=mk(L5,'<img src="logo_cart.png" style="width:470px;display:block">','a','filter:drop-shadow(0 30px 30px rgba(90,20,20,.25))');
const t5a=title(L5,'أشنو تنتظر؟!',230,130,'var(--red)');
const t5b=title(L5,'اتصل بينا الآن',230,104,'var(--green)');
const numCard=mk(L5,'','a card','width:900px;height:250px;border:6px solid var(--red);direction:ltr');
const phone=mk(numCard,'📞','a e','font-size:96px;left:40px;top:72px;filter:none');
const phoneRing=mk(numCard,'','a','left:30px;top:62px;width:120px;height:120px;border-radius:50%;border:5px solid var(--green)');
const digits=[...'24222227'].map((d,i)=>mk(numCard,d,'a',`left:${200+i*84}px;top:50px;font-size:130px;font-weight:900;color:var(--red);font-family:Alexandria;line-height:1.1;width:84px;text-align:center`));
const ring=mk(L5,'','a','width:300px;height:300px;border-radius:50%;border:8px solid var(--green)');

// ============ SCENE 6
const L6=layer();
const grid=mk(L6,'','layer','opacity:.5;background:linear-gradient(90deg,rgba(9,141,76,.08) 2px,transparent 2px) 0 0/120px 120px,linear-gradient(rgba(9,141,76,.08) 2px,transparent 2px) 0 0/120px 120px');
const roadA=mk(L6,'','a','width:1600px;height:70px;background:#fff;border:4px solid rgba(185,31,43,.25);border-radius:40px');
const roadB=mk(L6,'','a','width:60px;height:2200px;background:#fff;border:4px solid rgba(9,141,76,.25);border-radius:40px');
const pulse=mk(L6,'','a','width:260px;height:110px;border-radius:50%;border:6px solid var(--green)');
const pin=mk(L6,'','a','width:200px;height:200px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#d93844,#B91F2B 55%,#8d1520);box-shadow:-10px 20px 40px rgba(185,31,43,.35)');
mk(pin,'','a','left:60px;top:60px;width:80px;height:80px;border-radius:50%;background:#fff');
const t6a=title(L6,'أو تفضّل زورنا في نواكشوط',1120,64,'var(--ink)');
const t6b=title(L6,'على طريق أحمد بابا مسكي',1300,84,'var(--red)',true);
// final
const F=layer();
const fbg=mk(F,'','layer','background:radial-gradient(110% 70% at 50% 35%,#ffffff,#F7F7F2 60%,#ecebe2)');
const bigLeaf=mk(F,'','a leaf','width:900px;height:500px;opacity:.10');
const ringItems=['🍎','🥬','🧀','🍚','🧴','🍊','🥛','🍇','🧽','🫑','🍞','🍓'].map((c,i)=>({el:emo(F,c,130),i}));
const logo=mk(F,'<img src="logo_full.png" style="width:540px;display:block">','a');
const tag6=title(F,'كل شي تحتاجو، تْلگى في مكان واحد!',1150,70,'var(--green)');
const foot=mk(F,'','a card','width:960px;height:300px;');
mk(foot,'<span class="e" style="font-size:64px;filter:none">📞</span><span style="font-size:96px;font-weight:900;color:var(--red);direction:ltr;letter-spacing:4px">24222227</span>','a',`left:0;right:0;top:20px;width:960px;display:flex;justify-content:center;align-items:center;gap:26px`);
mk(foot,'','a','left:80px;top:150px;width:800px;height:3px;background:linear-gradient(90deg,transparent,rgba(9,141,76,.4),transparent)');
mk(foot,'<span class="e" style="font-size:50px;filter:none">📍</span><span style="font-size:46px;font-weight:800;color:var(--ink)">نواكشوط – طريق أحمد بابا مسكي</span>','a',`left:0;top:180px;width:960px;display:flex;justify-content:center;align-items:center;gap:18px;direction:rtl`);

// ============ RENDER
function render(t){
  // background bokeh drift
  bokeh.forEach((b,i)=>put(b.el,b.x+Math.sin(t*b.sp+b.ph)*60,(b.y-t*30*b.sp+H*4)%H+Math.cos(t*.7+b.ph)*30,1,0,1));
  coolTint.style.opacity=P(t,11.6,12.2)*(1-P(t,12.8,13.3));
  warmTint.style.opacity=P(t,12.8,13.3)*(1-P(t,14.8,15.2));
  freshTint.style.opacity=P(t,14.8,15.2)*(1-P(t,16.9,17.3));

  // ---- S1 0-7
  vis(L1,t<7.0);
  if(t<7.0){
    const cx=540,cy=1000;
    const conv=eio(P(t,3.9,5.3)); const freeze=P(t,3.25,3.5);
    const camS=1+0.05*Math.sin(t*1.3)*(1-conv);
    L1.style.transform=`scale(${camS}) rotate(${Math.sin(t*1.7)*1.2*(1-conv)}deg)`;
    put(s1cart,cx,cy,lerp(.9,1,eo(P(t,0,.8)))*(1+0.04*Math.sin(t*2)),Math.sin(t*3)*3*(1-freeze),eo(P(t,0,.5)));
    put(s1shadow,cx,cy+280,1,0,.8);
    const tt=Math.min(t,3.35); // time stops at freeze
    s1items.forEach(it=>{
      let x=((it.x0+it.vx*tt*0.35+Math.sin(tt*it.fx+it.ph)*120)%W+W)%W, y=((it.y0+it.vy*tt*0.3+Math.cos(tt*it.fx*1.2+it.ph)*120-200)%1500+1500)%1500+200;
      const ang=it.i/s1items.length*Math.PI*2+t*0.6, R=400;
      const tx=cx+Math.cos(ang)*R, ty=cy-40+Math.sin(ang)*R*0.95;
      x=lerp(x,tx,conv); y=lerp(y,ty,conv);
      const app=eo(P(t,0.1+it.i*0.12,0.5+it.i*0.12));
      put(it.el,x,y,app*lerp(1,.85,conv),it.rot*Math.sin(tt*2+it.ph)*(1-conv),app*(1-P(t,6.0,6.4)))});
    put(bags[0],200,520,eo(P(t,.6,1.1))*(1-P(t,3.4,3.8)),-12+Math.sin(t*4)*6,1);
    put(bags[1],880,1450,eo(P(t,1.3,1.8))*(1-P(t,3.4,3.8)),10+Math.sin(t*4+1)*6,1);
