<body><canvas id="c"></canvas>
<script>
const W=1080,H=1920,S=window.SCALE||2,TAU=Math.PI*2;
const cv=document.getElementById('c');cv.width=W*S;cv.height=H*S;const ctx=cv.getContext('2d');
const mk=()=>{const k=document.createElement('canvas');k.width=W*S;k.height=H*S;return k};
const scr=mk(),sx=scr.getContext('2d');
const lay=[mk(),mk()],lx=lay.map(k=>k.getContext('2d'));
const logo=new Image();logo.src='logo_rev.png';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const eo5=t=>1-Math.pow(1-t,5);
const ei=t=>t*t*t;
const fio=(t,a,b,c,d)=>Math.min(eo(prog(t,a,b)),1-eio(prog(t,c,d)));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const AR="'Tajawal'",EN="'Montserrat'";

function goldGrad(c,x0,y0,x1,y1){const g=c.createLinearGradient(x0,y0,x1,y1);
 g.addColorStop(0,'#7a5719');g.addColorStop(.2,'#c9a24c');g.addColorStop(.4,'#f2d999');g.addColorStop(.5,'#fff1cc');
 g.addColorStop(.6,'#d6b061');g.addColorStop(.8,'#a07a30');g.addColorStop(1,'#6a4a14');return g}
const GOLD='#d2ad5e',GOLDL='#f0d9a0';

// ---------- CAR GEOMETRY (side profile, front = +x, ground y=0) ----------
const BODY=new Path2D(),GLASS=new Path2D(),HL=new Path2D(),TL=new Path2D();
(()=>{const p=BODY,a=Math.asin(30/90);
 p.moveTo(470,-40);
 p.bezierCurveTo(492,-44,503,-70,502,-98);
 p.bezierCurveTo(501,-118,494,-128,478,-134);
 p.bezierCurveTo(400,-150,280,-166,160,-178);
 p.bezierCurveTo(100,-212,60,-250,10,-262);
 p.bezierCurveTo(-60,-276,-150,-274,-210,-262);
 p.bezierCurveTo(-280,-245,-340,-205,-380,-192);
 p.bezierCurveTo(-430,-186,-480,-182,-497,-170);
 p.bezierCurveTo(-511,-152,-512,-110,-505,-80);
 p.bezierCurveTo(-500,-56,-490,-44,-470,-42);
 p.lineTo(-410,-42);p.arc(-325,-72,90,Math.PI-a,a,false);
 p.lineTo(245,-42);p.arc(330,-72,90,Math.PI-a,a,false);
 p.lineTo(470,-40);p.closePath();
 const g=GLASS;g.moveTo(148,-184);
 g.bezierCurveTo(95,-214,58,-244,10,-252);
 g.bezierCurveTo(-60,-264,-150,-263,-205,-252);
 g.bezierCurveTo(-262,-238,-306,-212,-338,-196);
 g.bezierCurveTo(-200,-190,0,-186,148,-184);g.closePath();
 HL.moveTo(432,-140);HL.bezierCurveTo(466,-137,490,-130,500,-117);HL.lineTo(496,-109);HL.bezierCurveTo(474,-119,452,-126,428,-130);HL.closePath();
 TL.moveTo(-462,-180);TL.bezierCurveTo(-486,-176,-502,-166,-508,-152);TL.lineTo(-507,-143);TL.bezierCurveTo(-494,-156,-478,-164,-458,-170);TL.closePath();
})();

function drawWheel(c,x,y){
 c.save();c.translate(x,y);
 c.fillStyle='#060607';c.beginPath();c.arc(0,0,72,0,TAU);c.fill();
 c.strokeStyle='#19191b';c.lineWidth=4;c.beginPath();c.arc(0,0,64,0,TAU);c.stroke();
 let g=c.createRadialGradient(-12,-14,4,0,0,54);g.addColorStop(0,'#3b3c40');g.addColorStop(.7,'#121315');g.addColorStop(1,'#2a2b2e');
 c.fillStyle=g;c.beginPath();c.arc(0,0,53,0,TAU);c.fill();
 c.fillStyle='#b08a3a';c.beginPath();c.arc(0,0,44,-2.6,-1.5);c.arc(0,0,31,-1.5,-2.6,true);c.closePath();c.fill();
 for(let i=0;i<10;i++){c.save();c.rotate(i*TAU/10+.2);
  const sg=c.createLinearGradient(0,-6,0,6);sg.addColorStop(0,'#4d4f54');sg.addColorStop(.5,'#cfd2d8');sg.addColorStop(1,'#55575c');
  c.fillStyle=sg;c.beginPath();c.moveTo(11,-3.5);c.lineTo(51,-6.5);c.lineTo(51,6.5);c.lineTo(11,3.5);c.closePath();c.fill();c.restore();}
 c.strokeStyle='rgba(215,218,224,.6)';c.lineWidth=2.2;c.beginPath();c.arc(0,0,53,0,TAU);c.stroke();
 c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.arc(0,0,58,3.6,4.9);c.stroke();
 c.fillStyle='#1b1c1f';c.beginPath();c.arc(0,0,11,0,TAU);c.fill();
 c.strokeStyle=GOLD;c.lineWidth=1.6;c.stroke();
 c.restore();
}

function star(c,x,y,s,a){if(a<=0)return;c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;
 const g=c.createRadialGradient(x,y,0,x,y,s*1.2);g.addColorStop(0,'rgba(255,248,230,.9)');g.addColorStop(.25,'rgba(240,210,150,.35)');g.addColorStop(1,'rgba(240,210,150,0)');
 c.fillStyle=g;c.beginPath();c.arc(x,y,s*1.2,0,TAU);c.fill();
 c.fillStyle='rgba(255,250,235,.95)';
 c.beginPath();c.ellipse(x,y,s*2.4,s*.07+.6,0,0,TAU);c.fill();
 c.beginPath();c.ellipse(x,y,s*.07+.6,s*1.6,0,0,TAU);c.fill();c.restore();}

// o: env, tint, tintY, head, tail, rim, trace, sweep, film, filmA, wave, sparkle, shield, shieldEdge, t
function drawCarBody(c,o){
 const e=o.env??.5;
 drawWheel(c,-325,-72);drawWheel(c,330,-72);
 let g=c.createLinearGradient(0,-276,0,-40);
 g.addColorStop(0,'#3c3c41');g.addColorStop(.1,'#19191c');g.addColorStop(.36,'#09090b');g.addColorStop(.46,'#2c2c31');
 g.addColorStop(.52,'#0b0b0d');g.addColorStop(.8,'#040405');g.addColorStop(1,'#151517');
 c.fillStyle=g;c.fill(BODY);
 c.save();c.clip(BODY);
 c.globalCompositeOperation='lighter';
 const h=c.createLinearGradient(-520,0,520,0);
 h.addColorStop(0,'rgba(0,0,0,0)');h.addColorStop(.17,`rgba(255,250,240,${.04+.08*e})`);h.addColorStop(.3,'rgba(0,0,0,0)');
 h.addColorStop(.6,`rgba(255,236,200,${.035+.09*e})`);h.addColorStop(.73,'rgba(0,0,0,0)');h.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=h;c.fillRect(-520,-290,1040,260);
 c.beginPath();c.moveTo(478,-131);c.bezierCurveTo(200,-152,-200,-170,-498,-166);
 c.strokeStyle=`rgba(255,240,210,${.05+.1*e})`;c.lineWidth=16;c.stroke();
 c.strokeStyle=`rgba(255,250,240,${.22+.5*e})`;c.lineWidth=2.2;c.stroke();
 c.beginPath();c.moveTo(452,-88);c.bezierCurveTo(150,-92,-150,-96,-472,-99);
 c.strokeStyle=`rgba(255,255,255,${.05+.13*e})`;c.lineWidth=1.6;c.stroke();
 c.beginPath();c.moveTo(25,-259);c.bezierCurveTo(-60,-272,-150,-271,-208,-259);
 c.strokeStyle=`rgba(255,255,255,${.14+.4*e})`;c.lineWidth=2.4;c.stroke();
 c.beginPath();c.moveTo(470,-136);c.bezierCurveTo(380,-150,280,-163,165,-174);
 c.strokeStyle=`rgba(255,250,240,${.1+.3*e})`;c.lineWidth=2;c.stroke();
 if(o.wave!=null){ // polished region extra crisp reflections
  c.save();c.beginPath();c.rect(-600,-300,o.wave+600,300);c.clip();
  c.beginPath();c.moveTo(478,-128);c.bezierCurveTo(200,-149,-200,-167,-498,-163);c.strokeStyle='rgba(255,252,245,.55)';c.lineWidth=1.2;c.stroke();
  const hh=c.createLinearGradient(-520,0,520,0);hh.addColorStop(.05,'rgba(255,255,255,0)');hh.addColorStop(.12,'rgba(255,255,255,.12)');hh.addColorStop(.2,'rgba(0,0,0,0)');
  hh.addColorStop(.45,'rgba(0,0,0,0)');hh.addColorStop(.5,'rgba(255,240,210,.1)');hh.addColorStop(.56,'rgba(0,0,0,0)');c.fillStyle=hh;c.fillRect(-520,-290,1040,260);
  c.restore();
  const wg=c.createLinearGradient(o.wave-140,0,o.wave+60,0);
  wg.addColorStop(0,'rgba(230,190,110,0)');wg.addColorStop(.7,'rgba(240,205,130,.55)');wg.addColorStop(.86,'rgba(255,245,220,.8)');wg.addColorStop(1,'rgba(230,190,110,0)');
  c.fillStyle=wg;c.fillRect(o.wave-140,-300,200,300);
 }
 if(o.sweep!=null){c.save();c.transform(1,0,-.35,1,0,0);
  const sg=c.createLinearGradient(o.sweep-110,0,o.sweep+110,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,`rgba(255,248,235,${o.sweepA??.35})`);sg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=sg;c.fillRect(o.sweep-110,-300,220,320);c.restore();}
 if(o.film!=null){const x=o.film,fa=o.filmA??1;
  c.fillStyle=`rgba(255,255,255,${.045*fa})`;c.fillRect(x,-300,700,300);
  const fg=c.createLinearGradient(x,0,x+90,0);fg.addColorStop(0,`rgba(240,205,130,${.32*fa})`);fg.addColorStop(1,'rgba(240,205,130,0)');c.fillStyle=fg;c.fillRect(x,-300,90,300);
 }
 c.globalCompositeOperation='source-over';
 c.strokeStyle='rgba(0,0,0,.95)';c.lineWidth=1.8;
 c.beginPath();c.moveTo(150,-182);c.lineTo(138,-46);c.moveTo(-96,-186);c.lineTo(-102,-46);c.moveTo(-318,-195);c.bezierCurveTo(-322,-150,-300,-110,-262,-96);c.stroke();
 c.strokeStyle=`rgba(255,255,255,${.06+.06*e})`;c.lineWidth=1;
 c.beginPath();c.moveTo(152.5,-180);c.lineTo(140.5,-46);c.moveTo(-93.5,-184);c.lineTo(-99.5,-46);c.stroke();
 for(const hx of[62,-188]){c.fillStyle='#202124';c.beginPath();c.roundRect(hx,-154,52,8,4);c.fill();c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;c.stroke();}
 c.restore();
 // glass
 const ti=o.tint??1;
 const gg=c.createLinearGradient(0,-262,0,-184);gg.addColorStop(0,'#3b414a');gg.addColorStop(1,'#1a1d22');
 c.fillStyle=gg;c.fill(GLASS);
 c.save();c.clip(GLASS);
 c.fillStyle='#0d0e10';
 for(const [hx,hy] of[[-10,-214],[-175,-219]]){c.beginPath();c.roundRect(hx-26,hy,52,40,14);c.fill();}
 c.fillRect(-340,-196,500,10);
 const tY=o.tintY??999;
 c.fillStyle=`rgba(2,2,3,${.9*ti})`;c.fillRect(-360,-280,520,Math.min(100,tY+280));
 c.fillStyle=`rgba(2,2,3,${.9*(o.tintBase??ti)})`;if(tY<-180)c.fillRect(-360,tY,520,-180-tY);
 c.globalCompositeOperation='lighter';
 c.save();c.transform(1,0,-.9,1,0,0);
 const rg=c.createLinearGradient(-330,0,-180,0);rg.addColorStop(0,'rgba(255,255,255,0)');rg.addColorStop(.5,`rgba(255,250,240,${.08+.1*e})`);rg.addColorStop(1,'rgba(255,255,255,0)');
 c.fillStyle=rg;c.fillRect(-460,-280,600,100);
 const rg2=c.createLinearGradient(-60,0,20,0);rg2.addColorStop(0,'rgba(0,0,0,0)');rg2.addColorStop(.5,`rgba(240,210,150,${.07+.07*e})`);rg2.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=rg2;c.fillRect(-200,-280,400,100);c.restore();
 if(o.tintY!=null&&o.tintY>-262&&o.tintY<-184){c.shadowColor='rgba(230,190,110,.9)';c.shadowBlur=14*S;c.fillStyle='rgba(250,220,160,.95)';c.fillRect(-360,o.tintY-1.2,520,2.4);c.shadowBlur=0;}
 c.globalCompositeOperation='source-over';
 c.fillStyle='#050506';c.fillRect(-104,-270,13,100);
 c.restore();
 c.strokeStyle='rgba(175,178,186,.75)';c.lineWidth=2.4;c.stroke(GLASS);
 // mirror
 c.fillStyle='#0a0a0c';c.beginPath();c.ellipse(152,-194,22,9,-.18,0,TAU);c.fill();c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1.2;c.stroke();
 // lights
 const hd=o.head??.15;
 c.fillStyle='#1b1c1f';c.fill(HL);
 if(hd>0){c.save();c.shadowColor='rgba(255,240,215,1)';c.shadowBlur=22*S*hd;c.fillStyle=`rgba(255,248,235,${hd})`;c.fill(HL);c.restore();}
 c.strokeStyle='rgba(200,200,205,.6)';c.lineWidth=1;c.stroke(HL);
 c.fillStyle='#3a0709';c.fill(TL);
 const tl=o.tail??.6;c.save();c.shadowColor='rgba(200,25,30,.9)';c.shadowBlur=14*S*tl;c.fillStyle=`rgba(190,25,30,${.85*tl})`;c.fill(TL);c.restore();
 // rim light
 if((o.rim??0)>0){c.save();c.globalAlpha=o.rim;c.shadowColor='rgba(230,190,110,.9)';c.shadowBlur=16*S;
  c.strokeStyle=GOLDL;c.lineWidth=2.4;c.lineJoin='round';
  if(o.trace!=null)c.setLineDash([3100*o.trace+.01,8000]);
  c.stroke(BODY);c.restore();}
 if(o.film!=null&&(o.filmA??1)>0){const x=o.film;c.save();c.clip(BODY);c.globalAlpha=o.filmA??1;
  c.beginPath();for(let y=-290;y<=-30;y+=6){const xx=x+10*Math.sin(y/38+(o.t||0)*4);y==-290?c.moveTo(xx,y):c.lineTo(xx,y);}
  c.shadowColor='rgba(235,195,115,1)';c.shadowBlur=16*S;c.strokeStyle=GOLD;c.lineWidth=3;c.stroke();
  c.shadowBlur=0;c.strokeStyle='rgba(255,250,235,.9)';c.lineWidth=1;c.stroke();c.restore();}
 if(o.sparkle>0){const pts=[[400,-142],[230,-160],[-40,-266],[-160,-268],[-300,-176],[60,-170],[-420,-178],[300,-150]];
  pts.forEach(([x,y],i)=>{if(o.wave!=null&&x>o.wave)return;const ph=(o.t||0)*2.2+i*1.7;star(c,x,y,14,o.sparkle*Math.pow(Math.max(0,Math.sin(ph)),3));});}
}
function drawCar(c,o){
 c.save();c.scale(1,.075);const sg=c.createRadialGradient(0,0,20,0,0,620);sg.addColorStop(0,'rgba(0,0,0,.95)');sg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=sg;c.beginPath();c.arc(0,0,620,0,TAU);c.fill();c.restore();
 if(o.refl!==false){const ro={...o,rim:(o.rim||0)*.5,sparkle:0,film:null,tintY:null,shield:0};const N=6,bh=40;
  for(let i=0;i<N;i++){c.save();c.beginPath();c.rect(-720,i*bh,1440,bh+.5);c.clip();c.scale(1,-1);c.globalAlpha=(o.reflA??.17)*Math.pow(1-i/N,1.6);drawCarBody(c,ro);c.restore();}}
 if(o.shield>0)drawShield(c,o,0);
 drawCarBody(c,o);
 if(o.shield>0)drawShield(c,o,1);
}
function drawShield(c,o,front){
 c.save();c.translate(0,-150);c.scale(1.07,1.12);c.translate(0,150);
 c.beginPath();c.rect(o.shieldEdge??-700,-400,1400,500);c.clip();
 c.globalAlpha=o.shield;
 if(!front){const g=c.createLinearGradient(0,-280,0,-40);g.addColorStop(0,'rgba(255,240,210,.10)');g.addColorStop(1,'rgba(212,175,94,.02)');c.fillStyle=g;c.fill(BODY);}
 else{c.shadowColor='rgba(230,190,110,.8)';c.shadowBlur=12*S;c.strokeStyle='rgba(240,215,160,.75)';c.lineWidth=1.6;c.stroke(BODY);}
 c.restore();
 if(front&&o.shieldEdge!=null&&o.shieldEdge>-560&&o.shieldEdge<560){c.save();c.globalCompositeOperation='lighter';
  const x=o.shieldEdge;const g=c.createLinearGradient(x-4,0,x+70,0);g.addColorStop(0,'rgba(255,240,200,.0)');g.addColorStop(.1,'rgba(255,235,190,.6)');g.addColorStop(1,'rgba(230,190,110,0)');
  c.save();c.translate(0,-150);c.scale(1.07,1.12);c.translate(0,150);c.clip(BODY);c.fillStyle=g;c.fillRect(x-4,-400,74,500);c.restore();c.restore();}
}

function applyCam(c,cam){c.translate(cam.ax??540,cam.ay??960);if(cam.rot)c.rotate(cam.rot);c.scale(cam.z,cam.z);c.translate(-cam.fx,-cam.fy);}
function camPt(cam,x,y){const z=cam.z;return[(x-cam.fx)*z+(cam.ax??540),(y-cam.fy)*z+(cam.ay??960)];}
function carShot(c,cam,car,o,pre,post){c.save();applyCam(c,cam);pre&&pre(c);
 c.save();c.translate(car.x,car.y);c.scale(car.k,car.k);drawCar(c,o);c.restore();post&&post(c);c.restore();}

// ---------- TEXT ----------
function gtext(c,txt,x,y,o={}){
 const size=o.size||100,font=`${o.w||800} ${size}px ${o.f||EN}`,sc=o.scale??1,a=o.alpha??1;if(a<=0)return;
 sx.setTransform(S,0,0,S,0,0);sx.font=font;sx.letterSpacing=(o.ls||0)+'px';sx.direction=o.dir||'ltr';sx.textAlign='center';sx.textBaseline='middle';
 const w=sx.measureText(txt).width;const bx=Math.max(0,x-(w/2+size)*sc),by=Math.max(0,y-size*1.3*sc),bw=Math.min(W-bx,(w+size*2)*sc),bh=Math.min(H-by,size*2.8*sc);
 sx.setTransform(1,0,0,1,0,0);sx.clearRect(bx*S,by*S,bw*S,bh*S);
 sx.setTransform(S,0,0,S,0,0);sx.translate(x,y);sx.scale(sc,sc);
 const ex=o.ex||0;
 for(let i=ex;i>0;i--){const k=i/ex;sx.fillStyle=`rgb(${Math.round(lerp(120,40,k))},${Math.round(lerp(88,28,k))},${Math.round(lerp(30,8,k))})`;sx.fillText(txt,i*.25,i*.85);}
 sx.fillStyle=o.fill||goldGrad(sx,0,-size*.5,0,size*.45);sx.fillText(txt,0,0);
 if(o.sheen!=null){sx.globalCompositeOperation='source-atop';const s=o.sheen*(w+size*2)-(w/2+size);
  const g=sx.createLinearGradient(s-size*.5,-size,s+size*.5,size);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,`rgba(255,252,240,${o.sheenA??.9})`);g.addColorStop(1,'rgba(255,255,255,0)');
  sx.fillStyle=g;sx.fillRect(-w/2-size*2,-size*1.5,w+size*4,size*3);sx.globalCompositeOperation='source-over';}
 c.save();c.setTransform(1,0,0,1,0,0);c.globalAlpha*=a;
 if(o.glow){c.shadowColor=o.glowC||'rgba(214,175,94,.55)';c.shadowBlur=o.glow*S;}
 c.drawImage(scr,bx*S,by*S,bw*S,bh*S,bx*S,by*S,bw*S,bh*S);c.restore();
}
function ptext(c,txt,x,y,o={}){const a=o.alpha??1;if(a<=0)return;c.save();c.globalAlpha*=a;c.font=`${o.w||600} ${o.size||40}px ${o.f||AR}`;c.letterSpacing=(o.ls||0)+'px';
 c.direction=o.dir||'rtl';c.textAlign='center';c.textBaseline='middle';c.fillStyle=o.color||'#fff';if(o.glow){c.shadowColor=o.glowC||'rgba(0,0,0,.8)';c.shadowBlur=o.glow*S;}c.fillText(txt,x,y);c.restore();}

function vignette(c,s=.6){const g=c.createRadialGradient(540,960,420,540,960,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${s})`);c.fillStyle=g;c.fillRect(0,0,W,H);}
function bgGlow(c,x,y,r,col,a){if(a<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));c.fillStyle=g;c.fillRect(0,0,W,H);}
function flash(c,a,col='255,240,210'){if(a<=0)return;c.save();c.globalCompositeOperation='lighter';c.fillStyle=`rgba(${col},${a})`;c.fillRect(0,0,W,H);c.restore();}
function streak(c,x,y,len,th,a,col='255,236,200'){if(a<=0)return;c.save();c.globalCompositeOperation='lighter';
 const g=c.createLinearGradient(x-len,0,x+len,0);g.addColorStop(0,`rgba(${col},0)`);g.addColorStop(.5,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);
 c.fillStyle=g;c.beginPath();c.ellipse(x,y,len,th,0,0,TAU);c.fill();c.restore();}
function layer(c,i,a,fn){if(a<=0)return;if(a>=.999){fn(c);return;}const k=lx[i];k.setTransform(1,0,0,1,0,0);k.globalAlpha=1;k.globalCompositeOperation='source-over';k.clearRect(0,0,W*S,H*S);
