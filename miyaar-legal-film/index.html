<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Miyaar Legal Film</title>
<style>
@font-face{font-family:'El Messiri';font-weight:500;src:url(assets/el-messiri-arabic-500-normal.woff2)}
@font-face{font-family:'El Messiri';font-weight:600;src:url(assets/el-messiri-arabic-600-normal.woff2)}
@font-face{font-family:'El Messiri';font-weight:700;src:url(assets/el-messiri-arabic-700-normal.woff2)}
@font-face{font-family:'Plex Arabic';font-weight:400;src:url(assets/ibm-plex-sans-arabic-arabic-400-normal.woff2)}
@font-face{font-family:'Plex Arabic';font-weight:500;src:url(assets/ibm-plex-sans-arabic-arabic-500-normal.woff2)}
@font-face{font-family:'Plex Arabic';font-weight:600;src:url(assets/ibm-plex-sans-arabic-arabic-600-normal.woff2)}
@font-face{font-family:'Plex Arabic';font-weight:700;src:url(assets/ibm-plex-sans-arabic-arabic-700-normal.woff2)}
@font-face{font-family:'Montserrat';font-weight:500;src:url(assets/montserrat-latin-500-normal.woff2)}
@font-face{font-family:'Montserrat';font-weight:600;src:url(assets/montserrat-latin-600-normal.woff2)}
@font-face{font-family:'Amiri';font-weight:700;src:url(assets/amiri-arabic-700-normal.woff2)}
html,body{margin:0;padding:0;background:#F7F4EA}
body{width:1920px;height:1080px;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#F7F4EA;transform-origin:0 0}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.scene svg.art{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.tx{position:absolute;direction:rtl;box-sizing:border-box;line-height:1.3;white-space:nowrap}
.tx .w{display:inline-block}
.h-display{font-family:'El Messiri';font-weight:600;color:#302E2B}
.h-body{font-family:'Plex Arabic';font-weight:500;color:#3F4E5A}
.gold{color:#A8833F}
.pill{font-family:'Plex Arabic';font-weight:600;color:#7E6230;border:2px solid #C5A059;border-radius:999px;padding:12px 30px;background:rgba(255,255,255,.82);box-shadow:0 10px 30px rgba(63,78,90,.08)}
.kicker{font-family:'Plex Arabic';font-weight:600;color:#9C7A3A}
.kicker .rule{display:inline-block;width:80px;height:2px;background:#C5A059;vertical-align:middle;margin:0 26px}
.svcText .num{font-family:'Montserrat';font-weight:600;font-size:100px;color:#C5A059;line-height:1;direction:ltr;text-align:right}
.svcText .stitle{font-family:'El Messiri';font-weight:600;font-size:66px;color:#302E2B;margin-top:34px;white-space:normal;line-height:1.35}
.svcText .uline{width:150px;height:4px;background:#C5A059;margin-top:30px;margin-left:auto}
.vItem{font-family:'El Messiri';font-weight:600;color:#302E2B}
.vItem .dia{display:inline-block;width:16px;height:16px;background:#C5A059;transform:rotate(45deg);margin-left:28px;vertical-align:middle;position:relative;top:-4px}
.tagline{font-family:'El Messiri';font-weight:600;color:#9C7A3A}
.tagline .tw{display:inline-block}
.tagline .sep{display:inline-block;margin:0 30px;color:#C5A059}
.contact{direction:ltr !important;font-family:'Montserrat';font-weight:500;color:#3F4E5A;letter-spacing:.5px}
.contact .ci{display:inline-flex;align-items:center;gap:16px;vertical-align:middle}
.contact .cdiv{display:inline-block;width:2px;height:40px;background:#C5A059;margin:0 46px;vertical-align:middle}
.svgH{font-family:'El Messiri';font-weight:600}
.svgB{font-family:'Plex Arabic';font-weight:600}
.svgNum{font-family:'Montserrat';font-weight:600}
.veil{position:absolute;inset:0;background:#F7F4EA}
.flogo .sheenwrap{position:absolute;inset:0;-webkit-mask-image:url(assets/logo.png);-webkit-mask-size:100% 100%;mask-image:url(assets/logo.png);mask-size:100% 100%;overflow:hidden}
.flogo .sheen{position:absolute;top:0;left:0;width:180px;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,250,235,.85) 50%,rgba(255,255,255,0) 100%)}
.vgn{position:absolute;inset:0;pointer-events:none;z-index:100;background:radial-gradient(ellipse at 50% 50%,rgba(48,46,43,0) 62%,rgba(48,46,43,.10) 100%)}
/* vertical 9:16 adaptation */
body.v{width:1080px;height:1920px}
#vwrap{display:none}
#vsubs{position:absolute;left:70px;top:1380px;width:940px;height:300px}
.vsub{position:absolute;left:0;top:0;width:940px;direction:rtl;text-align:center;font-family:'El Messiri';font-weight:600;font-size:50px;line-height:1.55;color:#302E2B;white-space:normal}
.vsite{position:absolute;left:0;top:1780px;width:1080px;text-align:center;font-family:'Montserrat';font-weight:500;font-size:30px;color:#9C7A3A;letter-spacing:1px}
body.v #vwrap{display:block;position:absolute;left:0;top:0;width:1080px;height:1920px;background:#F7F4EA;overflow:hidden}
</style>
</head>
<body>
<div id="vwrap"></div>
<div id="stage"></div>
<script src="assets/gsap.min.js"></script>
<script src="art.js"></script>
<script src="film.js"></script>
</body>
</html>
