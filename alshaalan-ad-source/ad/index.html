<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,RATE=1.04;
const GOLD='#C5A059',GOLD_L='#E3C88F',GOLD_D='#9A7638',IVORY='#F7F7F2',BEIGE='#EDE7DB',GRAY='#E9ECEE',NAVY='#162E4A',CHAR='#333333';
const AF='Alex',PF='Plex';
const cv=document.getElementById('c'),X=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const eoutx=t=>t>=1?1:1-Math.pow(2,-10*t);
const eback=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const P=(a,s,d)=>clamp((a-s)/d);
const win=(a,s,e,fi=.4,fo=.4)=>Math.min(P(a,s,fi),1-P(a,e-fo,fo));
const lr=(A,B,t)=>A.map((v,i)=>lerp(v,B[i],t));
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const IMG={};
function loadImg(n){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.src=n+'.png'})}

/* ================= VILLA (layers) ================= */
function glass(c,x,y,w,h,warm,mull){
  let g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'#1E3656');g.addColorStop(1,'#34537A');
  c.fillStyle=g;c.fillRect(x,y,w,h);
  if(warm){let r=c.createRadialGradient(x+w*.5,y+h,10,x+w*.5,y+h,w*.75);r.addColorStop(0,'rgba(255,200,130,.75)');r.addColorStop(.6,'rgba(255,190,120,.25)');r.addColorStop(1,'rgba(255,190,120,0)');c.fillStyle=r;c.fillRect(x,y,w,h);}
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  c.fillStyle='rgba(255,255,255,.16)';c.beginPath();c.moveTo(x+w*.15,y);c.lineTo(x+w*.42,y);c.lineTo(x+w*.12,y+h);c.lineTo(x-w*.15,y+h);c.fill();
  c.fillStyle='rgba(255,255,255,.08)';c.beginPath();c.moveTo(x+w*.5,y);c.lineTo(x+w*.58,y);c.lineTo(x+w*.28,y+h);c.lineTo(x+w*.2,y+h);c.fill();
  c.restore();
  c.strokeStyle='#EFE9DD';c.lineWidth=3;
  for(let i=1;i<mull;i++){c.beginPath();c.moveTo(x+w*i/mull,y);c.lineTo(x+w*i/mull,y+h);c.stroke();}
  c.lineWidth=5;c.strokeRect(x,y,w,h);
}
function slats(c,x,y,w,h){c.fillStyle='#B48D5C';c.fillRect(x,y,w,h);c.strokeStyle='#8A663C';c.lineWidth=2.4;for(let i=x+5;i<x+w;i+=9){c.beginPath();c.moveTo(i,y);c.lineTo(i,y+h);c.stroke();}
  let g=c.createLinearGradient(x,y,x,y+h);g.addColorStop(0,'rgba(0,0,0,.12)');g.addColorStop(.3,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x,y,w,h);}
function poly(c,pts,fill){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath();c.fillStyle=fill;c.fill();}
function palm(c,x,y,h,lean){
  c.strokeStyle='#8B6F4E';c.lineWidth=13;c.lineCap='round';
  c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+lean*.3,y-h*.5,x+lean,y-h);c.stroke();
  c.strokeStyle='rgba(60,40,20,.35)';c.lineWidth=2;
  for(let i=1;i<12;i++){const t=i/12;const px=lerp(x,x+lean,t*t)+lean*.3*2*t*(1-t)*0;const py=y-h*t;c.beginPath();c.moveTo(px-6,py);c.lineTo(px+6,py-3);c.stroke();}
  const tx=x+lean,ty=y-h;
  const angs=[-2.9,-2.5,-2.0,-1.5,-1.05,-.6,-.2,-3.3,-1.75];
  angs.forEach((an,i)=>{const L=110+ (i%3)*25;const ex=tx+Math.cos(an)*L,ey=ty+Math.sin(an)*L*.55+L*.35;
    c.fillStyle=i%2?'#5E7A47':'#6F8C52';c.beginPath();c.moveTo(tx,ty);
    c.quadraticCurveTo(tx+Math.cos(an)*L*.5,ty+Math.sin(an)*L*.5-28,ex,ey);
    c.quadraticCurveTo(tx+Math.cos(an)*L*.45,ty+Math.sin(an)*L*.45-6,tx,ty+4);c.fill();});
}
function shrub(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,r,r*.78,0,0,7);c.fill();c.fillStyle='rgba(255,255,255,.12)';c.beginPath();c.ellipse(x-r*.3,y-r*.3,r*.45,r*.3,0,0,7);c.fill();}
function makeVilla(){
  const L={};const O=[50,35];
  // background
  let bg=mk(1100,770),c=bg.getContext('2d');
  let g=c.createLinearGradient(0,0,0,560);g.addColorStop(0,'#E8D6B8');g.addColorStop(.55,'#F4E8D4');g.addColorStop(1,'#FAF4EA');c.fillStyle=g;c.fillRect(0,0,1100,770);
  let r=c.createRadialGradient(900,200,10,900,200,420);r.addColorStop(0,'rgba(255,232,180,.95)');r.addColorStop(1,'rgba(255,232,180,0)');c.fillStyle=r;c.fillRect(0,0,1100,770);
  c.fillStyle='rgba(205,190,165,.55)';[[20,470,60,90],[90,440,50,120],[150,490,80,70],[950,460,60,100],[1020,430,50,130],[600,500,80,60]].forEach(b=>c.fillRect(b[0],b[1],b[2],b[3]));
  c.fillStyle='#E4D8C3';c.fillRect(0,553,1100,220);
  L.bg=bg;
  // building
  let bd=mk(1100,770);c=bd.getContext('2d');c.translate(O[0],O[1]);
  c.save();c.filter='blur(10px)';poly(c,[150,520,880,520,840,565,90,565],'rgba(70,50,30,.28)');c.restore();
  c.fillStyle='#E9E0CF';c.fillRect(0,520,1000,65);
  poly(c,[760,360,835,333,835,500,760,520],'#D6CCBB');
  g=c.createLinearGradient(180,0,760,0);g.addColorStop(0,'#F7F3EB');g.addColorStop(1,'#EAE2D3');c.fillStyle=g;c.fillRect(180,360,580,160);
  c.fillStyle='#CDBB9C';c.fillRect(130,300,60,220);c.strokeStyle='rgba(110,85,55,.28)';c.lineWidth=2;for(let yy=312;yy<520;yy+=17){c.beginPath();c.moveTo(130,yy);c.lineTo(190,yy);c.stroke();}
  c.fillStyle='rgba(0,0,0,.1)';c.fillRect(190,300,8,220);
  glass(c,215,385,300,135,true,4);slats(c,540,375,80,145);glass(c,645,395,95,85,true,2);
  poly(c,[165,345,240,318,855,318,780,345],'#EFE9DE');
  c.fillStyle='#FBF9F4';c.fillRect(165,345,615,18);c.fillStyle='rgba(0,0,0,.13)';c.fillRect(180,363,580,9);
  poly(c,[860,232,930,207,930,322,860,345],'#D3C8B5');
  g=c.createLinearGradient(300,0,860,0);g.addColorStop(0,'#FAF7F1');g.addColorStop(1,'#EFE8DB');c.fillStyle=g;c.fillRect(300,232,560,113);
  glass(c,335,252,270,93,true,3);slats(c,620,245,70,100);glass(c,705,252,130,93,true,2);
  c.fillStyle='rgba(0,0,0,.12)';c.fillRect(300,234,560,8);
  poly(c,[285,218,355,193,950,193,880,218],'#F2ECE2');poly(c,[880,218,950,193,950,207,880,234],'#DCD2C1');
  c.fillStyle='#FFFFFF';c.fillRect(285,218,595,16);
  c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=2;c.strokeRect(190,322,95,23);
  L.bld=bd;
  // foreground
  let fg=mk(1100,770);c=fg.getContext('2d');c.translate(O[0],O[1]);
  c.fillStyle='#A3AE78';c.fillRect(-50,560,1100,30);
  c.fillStyle='#EFE7D8';c.fillRect(-50,585,1100,200);
  c.fillStyle='#F6F1E7';poly(c,[90,590,730,590,712,662,68,662],'#F6F1E7');
  g=c.createLinearGradient(0,600,0,655);g.addColorStop(0,'#86CAD3');g.addColorStop(1,'#4C9DB2');poly(c,[105,600,715,600,700,652,85,652],g);
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2.5;for(let i=0;i<7;i++){const xx=150+i*85,yy=615+(i%3)*11;c.beginPath();c.moveTo(xx,yy);c.quadraticCurveTo(xx+18,yy-5,xx+36,yy);c.stroke();}
  [[205,522,30,'#6E8150'],[250,526,24,'#7E9160'],[560,524,28,'#6E8150'],[600,528,22,'#82966A'],[700,524,30,'#6E8150'],[745,528,22,'#7E9160'],[880,560,36,'#6A7E4C'],[930,565,28,'#7E9160']].forEach(s=>shrub(c,s[0],s[1],s[2],s[3]));
  palm(c,40,600,430,30);palm(c,975,575,360,-25);
  L.fg=fg;
  // ordinary (flat, dull) versions
  for(const k of ['bg','bld','fg']){const o=mk(1100,770),oc=o.getContext('2d');oc.filter='saturate(.25) contrast(.82) brightness(1.03)';oc.drawImage(L[k],0,0);L[k+'O']=o;}
  const ob=L.bgO.getContext('2d');ob.globalCompositeOperation='source-atop';ob.fillStyle='rgba(205,212,218,.55)';ob.fillRect(0,0,1100,560);
  return L;
}
let V;
// draw villa into rect with parallax px, premium mix
function villa(c,x,y,w,h,px=0,mix=1,rad=0,tilt=0){
  const s=w/1000;c.save();if(rad>=0){rr(c,x,y,w,h,rad);c.clip();}
  if(tilt){c.translate(x+w/2,y+h/2);c.rotate(tilt);c.scale(1.08,1.08);c.translate(-x-w/2,-y-h/2);}
  const f={bg:-.35,bld:0,fg:.55};
  for(const pass of [0,1]){
    if(pass===0&&mix>=1)continue; if(pass===1&&mix<=0)continue;
    c.globalAlpha=pass?mix:1;
    for(const k of ['bg','bld','fg']){c.drawImage(V[k+(pass?'':'O')],x+(-50+px*f[k])*s,y-35*s+(h-700*s)/2,1100*s,770*s);}
  }
  c.globalAlpha=1;c.restore();
}
const SIL=[130,520,130,300,190,300,190,345,285,345,285,218,355,193,950,193,950,322,860,345,835,345,835,500,760,520];

/* ================= THUMBS / CARDS ================= */
function thumb(type){
  const t=mk(576,400),c=t.getContext('2d');
  const sky=(a,b)=>{let g=c.createLinearGradient(0,0,0,300);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,576,400);};
  if(type==='villa2'||type==='villa3'){
    c.save();if(type==='villa3'){c.translate(576,0);c.scale(-1,1);}
    c.filter=type==='villa2'?'saturate(.75) hue-rotate(-8deg)':'saturate(.6) brightness(1.04)';
    for(const k of ['bg','bld','fg'])c.drawImage(V[k],-40,-20,633,443);c.restore();return t;}
  if(type==='tower'){sky('#D6E0E8','#F1F3F4');
    c.fillStyle='#C9D3DC';c.fillRect(60,120,110,280);c.fillRect(420,90,100,310);
    let g=c.createLinearGradient(220,0,370,0);g.addColorStop(0,'#5D7C99');g.addColorStop(1,'#2E4C6C');c.fillStyle=g;c.fillRect(215,40,150,360);
    c.fillStyle='#4A6886';c.fillRect(365,60,40,340);
    c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;for(let y=60;y<400;y+=22){c.beginPath();c.moveTo(215,y);c.lineTo(365,y);c.stroke();}
    for(let x=245;x<365;x+=30){c.beginPath();c.moveTo(x,40);c.lineTo(x,400);c.stroke();}
    c.fillStyle='#E7E1D6';c.fillRect(0,360,576,40);return t;}
  if(type==='apt'){sky('#E3E6E2','#F5F3EE');
    c.fillStyle='#E6DCCB';c.fillRect(110,90,360,300);c.fillStyle='#D4C8B3';c.fillRect(470,110,50,280);
    for(let r=0;r<6;r++)for(let k=0;k<5;k++){c.fillStyle='#3A4F66';c.fillRect(130+k*68,108+r*46,46,28);c.fillStyle='#F8F4EC';c.fillRect(126+k*68,136+r*46,54,6);}
    c.fillStyle='#8FA070';[[90,385,30],[500,388,26]].forEach(s=>{c.beginPath();c.arc(s[0],s[1],s[2],0,7);c.fill();});
    c.fillStyle='#E9E1D2';c.fillRect(0,385,576,15);return t;}
  if(type==='comm'){sky('#E6E2DA','#F6F4EF');
    c.fillStyle='#F2EEE6';c.fillRect(40,150,500,230);
    let g=c.createLinearGradient(0,170,0,370);g.addColorStop(0,'#2F4B6B');g.addColorStop(1,'#456789');c.fillStyle=g;c.fillRect(60,175,460,95);c.fillRect(60,285,460,85);
    c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=3;for(let x=60;x<=520;x+=46){c.beginPath();c.moveTo(x,175);c.lineTo(x,370);c.stroke();}
    c.fillStyle=GOLD;c.fillRect(170,152,240,16);c.fillStyle='#FFFFFF';c.fillRect(30,268,520,14);
    c.fillStyle='#E8E0D0';c.fillRect(0,375,576,25);return t;}
  if(type==='land'){sky('#E9DFCD','#F7F1E6');
    c.fillStyle='rgba(190,175,150,.6)';[[40,230,40,40],[90,215,30,55],[450,220,45,50],[500,235,35,35]].forEach(b=>c.fillRect(...b));
